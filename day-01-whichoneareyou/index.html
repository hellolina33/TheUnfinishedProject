<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>WhichOneAreYou</title>
<meta name="author" content="Salah Khenissi">
<meta name="description" content="Famille, amis, couple, collègues : dépose ton export WhatsApp, WhichOneAreYou distribue les cartes. Chiffres et sources à l'appui. Calculs dans ton navigateur.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Onest:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Hallmark · theme: custom · idea: "your group chat, dealt as a deck of character cards; each kind of chat is a suit" · vibe: "card table, sardonic, round, loud, bilingual" · paper: felt green with card stock · accent: chip yellow · faces: Bagel Fat One (display), Onest (body) · posture: dark/rounded-heavy/chromatic-yellow · hero: a fanned hand of five persona cards, re-dealt by Shuffle · redesign: full · built: the project */
/* critique: the old page was a pastel SaaS kit (hairline bento, light grotesk heads, purple-pink wash); this one commits to one metaphor, the card table, and lets the characters carry the colour */
/* waive 80: the drawn characters are the product's output (the persona a user is dealt), not decoration */
/* waive 73: the hero is a fanned hand of cards; each card overlaps its neighbour by design, every name is readable on hover/focus and in the cast below */
/* waive 39b: button.pc is a whole playing card acting as a link to its suit, not a sized control */
/* Hallmark · reworded "qui porte vraiment la conversation ?" to "dans ton groupe, lequel tu es ?" · rename to WhichOneAreYou */
/* Hallmark · reworded "quarante personas…" to "quarante cartes…" · card-table identity */
/* Hallmark · dropped section #ugc (ugc, ugcList) and its figures · 46a invented testimonials */
/* Hallmark · dropped constat figures 40 s, 0 ?, 71 % · 40 invented metrics */
/* Hallmark · "bibliographie" kept as a collapsible summary · 58 words per screen */
:root{
  --felt:#1F5C47; --felt-deep:#184B3A; --felt-line:#2F6D57; --felt-ink:#F3F1F8; --felt-muted:#BCD8CD;
  --card:#F8F7FC; --table:#EEECF4; --ink:#17141F; --muted:#5E5869; --line:#DAD6E4; --soft:#E7E4EF;
  --chip:#FFD84D; --chip-ink:#17141F; --accent:#1F5C47; --focus:#FFD84D;
  --lilac:#D8C6FA; --mint:#BDF0A8; --peach:#FFB894; --lemon:#FFE36E; --sky:#A9D6FF; --pink:#FFB8DE;
  --on:#17141F; --on-soft:rgba(248,247,252,.6); --on-ink:#F8F7FC;
  --bad-bg:#FFE1E1; --bad-ink:#6B1212; --warn-bg:#FFD1C2;
  --heat-0:#E7E4EF; --heat-1:#C9E6D8; --heat-2:#8FCBB1; --heat-3:#3F9C78; --heat-4:#1F5C47;
  --shadow:rgba(23,20,31,.28); --dot:rgba(243,241,248,.12);
  --f-display:"Bagel Fat One","Arial Rounded MT Bold",ui-rounded,ui-sans-serif,sans-serif;
  --f-body:"Onest",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-card:16px; --r-panel:20px; --r-ctl:12px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--felt:#0F2A21;--felt-deep:#0B211A;--felt-line:#1E3E32;--felt-muted:#9DBDB0;--card:#1C1A24;--table:#121017;--ink:#F3F1F8;--muted:#A9A2B6;--line:#2C2835;--soft:#24212D;--accent:#8FCBB1;--heat-0:#24212D;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--felt:#0F2A21;--felt-deep:#0B211A;--felt-line:#1E3E32;--felt-muted:#9DBDB0;--card:#1C1A24;--table:#121017;--ink:#F3F1F8;--muted:#A9A2B6;--line:#2C2835;--soft:#24212D;--accent:#8FCBB1;--heat-0:#24212D;--shadow:rgba(0,0,0,.5);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:clip;scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
body{overflow-x:clip;background:var(--table);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;font-synthesis:none;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--felt)}
img,svg,canvas{max-width:100%;display:block}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,label:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
section{padding-block:96px}
@media (max-width:720px){section{padding-block:64px}}
p{text-wrap:pretty}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;overflow-wrap:break-word;min-width:0}
h2{font-size:clamp(40px,5.6vw,72px);line-height:.96;letter-spacing:-.02em;max-width:14ch}
h3{font-size:24px;line-height:1.12}
h4,h5{font-family:var(--f-body);font-weight:600}
.lead{font-size:clamp(16px,1.6vw,20px);color:var(--muted);max-width:48ch;margin-top:20px}
.sec-head{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:20px 48px;align-items:end;margin-bottom:48px}
.sec-head .lead{margin:0}
@media (max-width:860px){.sec-head{grid-template-columns:minmax(0,1fr);margin-bottom:32px}}
.muted{color:var(--muted)}
.small{font-size:14px}
.felt{background:var(--felt);color:var(--felt-ink)}
.felt .lead,.felt .muted{color:var(--felt-muted)}
.felt-deep{background:var(--felt-deep);color:var(--felt-ink)}
.felt-deep .lead{color:var(--felt-muted)}
.table{background:var(--table);color:var(--ink)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r-ctl);border:2px solid var(--ink);background:var(--ink);color:var(--card);font-weight:600;font-size:16px;text-decoration:none;white-space:nowrap;cursor:pointer;transition:transform .16s cubic-bezier(.16,1,.3,1),background-color .16s,color .16s,border-color .16s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn .go{display:none}
.btn.primary,.felt .btn,.felt-deep .btn{background:var(--chip);border-color:var(--chip);color:var(--chip-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.felt .btn.ghost{background:transparent;color:var(--felt-ink);border-color:var(--felt-line)}
.felt .btn.ghost:hover{border-color:var(--felt-ink)}
.btn.soft{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px}
.btn[disabled],.btn:disabled{background:var(--soft);border-color:var(--soft);color:var(--muted);cursor:not-allowed;transform:none}
.link{color:inherit;font-weight:600;text-underline-offset:4px;text-decoration-thickness:2px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--felt);color:var(--felt-ink);border-bottom:1px solid var(--felt-line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:22px;letter-spacing:-.01em;text-decoration:none;color:inherit}
.logo .mark{width:32px;height:32px;flex:none}
.top nav{display:flex;gap:4px;margin-left:auto;font-size:15px}
.top nav a{text-decoration:none;color:var(--felt-muted);padding:8px 12px;border-radius:8px}
.top nav a:hover{color:var(--felt-ink)}
.lang{display:flex;border:1px solid var(--felt-line);border-radius:12px;padding:4px;gap:4px}
.lang button{border:0;background:transparent;padding:4px 8px;border-radius:8px;font-weight:600;font-size:13px;color:var(--felt-muted);min-height:32px}
.lang button[aria-pressed="true"]{background:var(--chip);color:var(--chip-ink)}
.top .cta-head{min-height:40px;padding:0 16px;font-size:14px}
@media (max-width:960px){.top nav{display:none}.top .lang{margin-left:auto}}
@media (max-width:440px){.top .cta-head{display:none}}

/* hero */
.hero{padding-block:56px 88px;position:relative;min-height:calc(100svh - 64px);display:flex;align-items:center}
.hero>.wrap{width:100%}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 1.6px) 0 0/24px 24px;pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--felt-line);border-radius:999px;padding:4px 16px 4px 4px;font-size:14px;text-decoration:none;color:var(--felt-ink);margin-bottom:24px;max-width:100%}
.badge b{background:var(--pink);color:var(--on);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;flex:none}
.badge span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge:hover{border-color:var(--felt-ink)}
.hero h1{font-size:clamp(52px,6.2vw,92px);line-height:.92;letter-spacing:-.02em;max-width:11ch;color:var(--felt-ink)}
.hero .lead{margin-top:24px;max-width:40ch;color:var(--felt-muted)}
.hero .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.hero .note{margin-top:20px;font-size:14px;color:var(--felt-muted);max-width:44ch}
.dot{display:none}
@media (max-width:900px){.hero .wrap{grid-template-columns:minmax(0,1fr);gap:40px}}

/* the hand (hero deck) */
.deck-wrap{display:flex;flex-direction:column;align-items:center;gap:20px;min-width:0}
.collage{position:relative;width:100%;max-width:520px;aspect-ratio:5/4}
@media (max-width:600px){.collage{width:86%}}
.collage .pc{position:absolute;left:50%;bottom:4%;width:30%;transform-origin:50% 150%;transform:translateX(calc(-50% + var(--x))) rotate(var(--rot)) translateY(var(--lift,0px));transition:transform .42s cubic-bezier(.16,1,.3,1);border:0;padding:0;background:none;text-align:left}
.collage .pc:hover,.collage .pc:focus-visible{--lift:-20px;z-index:5}
.collage.dealing .pc{transform:translateX(-50%) rotate(0deg) translateY(24px)}
.deck-tools{display:flex;gap:12px;align-items:center;color:var(--felt-muted);font-size:14px}
.art-cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.art-cats button{border:1px solid var(--felt-line);background:transparent;color:var(--felt-ink);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.art-cats button:hover{border-color:var(--felt-ink)}
.art-cats button i{font-style:normal;font-size:16px;color:var(--chip)}

/* the playing card (shared by the hand and the cast) */
.pcard{display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:var(--r-card);overflow:hidden;box-shadow:0 12px 28px -16px var(--shadow)}
.pcard .face{position:relative;background:var(--c);aspect-ratio:4/5;display:grid;place-items:center;border-bottom:2px solid var(--ink)}
.pcard .face>svg{width:86%;height:auto}
.pcard .suit{position:absolute;top:8px;left:12px;font-size:20px;line-height:1;color:var(--on)}
.pcard .suit.r{left:auto;right:12px;top:auto;bottom:8px;transform:rotate(180deg)}
.pcard .body{padding:12px 12px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.pcard strong{font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.08}
.collage .pcard .body{padding:8px 12px 12px}
.collage .pcard strong{font-size:clamp(13px,1.4vw,17px);display:block;min-height:2.2em}

/* constat */
.m-grid{display:grid;border-top:2px solid var(--ink)}
.m-card{display:grid;grid-template-columns:auto minmax(0,.9fr) minmax(0,1.1fr);gap:16px 48px;padding-block:32px;border-bottom:1px solid var(--line);align-items:baseline}
.m-card .s{font-size:32px;line-height:1;color:var(--accent)}
.m-card h3{font-size:clamp(26px,3.2vw,40px)}
.m-card p{color:var(--muted);font-size:17px;max-width:56ch}
.m-card .big{display:none}
@media (max-width:760px){.m-card{grid-template-columns:auto minmax(0,1fr);padding-block:24px}.m-card p{grid-column:1/-1}}

/* cast */
#casting h2{color:var(--felt-ink)}
.tabs{display:inline-flex;flex-wrap:wrap;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-ctl);padding:4px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:8px 16px;font-weight:600;font-size:15px;color:var(--muted);min-height:40px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--card)}
.felt-deep .tabs{background:transparent;border-color:var(--felt-line)}
.felt-deep .tabs button{color:var(--felt-muted)}
.felt-deep .tabs button[aria-selected="true"]{background:var(--chip);color:var(--chip-ink)}
.cast{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-top:24px}
.cast-card{display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:var(--r-card);overflow:hidden}
.cast-card .art{position:relative;background:var(--c);aspect-ratio:5/4;display:grid;place-items:center;border-bottom:2px solid var(--ink)}
.cast-card .art>svg{width:68%;height:auto}
.cast-card .art .suit{position:absolute;top:8px;left:12px;font-size:20px;line-height:1;color:var(--on)}
.cast-card strong{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.08;padding:16px 16px 0}
.cast-card .d{font-size:14px;line-height:1.5;color:var(--muted);padding:8px 16px 0}
.cast-card .act{font-size:14px;line-height:1.45;margin:12px 16px 0;padding:8px 12px;background:var(--soft);color:var(--ink);border-radius:8px}
.cast-card .by{font-size:13px;color:var(--muted);margin-top:auto;padding:16px}
.cast-card .by a{color:var(--ink)}
@media (max-width:1100px){.cast{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cast{grid-template-columns:minmax(0,1fr)}}

/* app */
#app{background:var(--table)}
.drop{border-radius:var(--r-panel);background:var(--card);border:2px solid var(--ink);padding:24px 24px 16px;position:relative;transition:border-color .16s,box-shadow .16s}
.drop.over{border-color:var(--accent);box-shadow:0 0 0 6px var(--chip)}
.drop-main{display:flex;gap:20px;align-items:center}
.drop .faces{display:flex;flex:none}
.drop .faces svg{width:52px;height:52px;margin-left:-12px}
.drop .faces svg:first-child{margin-left:0}
.drop h3{font-size:clamp(24px,3vw,32px)}
.drop p{color:var(--muted);margin-top:8px;max-width:56ch;font-size:15px}
.drop-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:20px;padding-top:16px}
.drop-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--table);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;color:var(--ink);min-height:40px}
.chip:hover{border-color:var(--ink)}
.chip[aria-expanded="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.drop .pick{cursor:pointer;background:var(--chip);border-color:var(--ink);color:var(--chip-ink)}
.drop .pick span:first-child{font-size:20px;line-height:1}
.drop:has(#file:focus-visible) .pick{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:600px){.drop{padding:20px 16px 16px}.drop-main{flex-direction:column;align-items:flex-start;gap:16px}.drop-bar .pick{width:100%}}
.blocked{margin-top:12px;border-radius:var(--r-ctl);background:var(--lemon);color:var(--on);padding:16px;font-size:15px;line-height:1.5}
.blocked b{display:block;font-size:16px;margin-bottom:4px}
.side{margin-top:16px}
.side-opts{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;font-size:14px;color:var(--muted)}
.side-opts a{color:var(--ink);font-weight:600;text-underline-offset:4px}
.switch{display:inline-flex;align-items:center;gap:12px;cursor:pointer;user-select:none;min-height:44px}
.switch input{appearance:none;width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background-color .16s;cursor:pointer;flex:none}
.switch input::after{content:"";position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--card);transition:transform .16s cubic-bezier(.16,1,.3,1)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(16px)}
.paste{margin-top:12px}
#pasteBox{display:grid;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-panel);padding:16px}
#pasteBox textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--table);padding:12px;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);resize:vertical}
#pasteBox .btn{justify-self:start}
.err{margin-top:16px;border-radius:var(--r-ctl);background:var(--bad-bg);color:var(--bad-ink);padding:12px 16px;font-size:15px;display:none}
.err.show{display:block}
.loader{display:none;margin-top:32px;text-align:center;padding-block:56px;border:2px dashed var(--line);border-radius:var(--r-panel)}
.loader.show{display:block}
.loader .faces{display:flex;justify-content:center;gap:12px}
.loader .faces svg{width:44px;height:44px;animation:hop .9s ease-in-out infinite}
.loader .faces svg:nth-child(2){animation-delay:.15s}.loader .faces svg:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.loader p{margin-top:16px;color:var(--muted)}

/* quiz */
.quiz{margin-top:32px;background:var(--card);border:2px solid var(--ink);border-radius:var(--r-panel);padding:28px 24px;display:none}
.quiz.show{display:block}
.q-prog{display:flex;gap:4px;margin-bottom:16px}
.q-prog i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.q-prog i.on{background:var(--ink)}
.quiz h3{font-size:clamp(28px,4vw,44px);margin-top:8px}
.quiz .q-sub{color:var(--muted);margin:8px 0 24px;max-width:54ch}
.opts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:var(--r-ctl);padding:16px;background:var(--table);text-align:left;font-weight:600;font-size:16px;display:flex;flex-direction:column;gap:8px;position:relative;transition:border-color .16s}
.opt:hover{border-color:var(--ink)}
.opt svg{width:52px;height:52px}
.opt small{font-weight:400;color:var(--muted);font-size:13px}
.opt .tag{position:absolute;top:8px;right:8px;background:var(--chip);color:var(--chip-ink);font-size:12px;font-weight:600;border-radius:999px;padding:4px 8px}
.opt[aria-pressed="true"]{border:2px solid var(--ink);background:var(--card)}
.q-nav{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap}

/* report */
#dash{display:none;margin-top:32px}
#dash.show{display:block}
.d-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.d-head h3{font-size:clamp(32px,4.6vw,56px);line-height:.98;overflow-wrap:anywhere}
.d-head .per{color:var(--muted);font-size:15px;margin-top:8px}
.d-actions{display:flex;flex-wrap:wrap;gap:8px}
.d-actions .btn{min-height:40px;padding:0 16px;font-size:14px}
.d-bar{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-ctl);padding:8px 16px;margin-bottom:12px;font-size:15px}
.d-bar select{border:1px solid var(--line);background:var(--table);border-radius:8px;padding:8px 12px;font-weight:600;max-width:100%;min-height:40px}
.seg2{display:inline-flex;border:1px solid var(--line);background:var(--table);border-radius:var(--r-ctl);padding:4px;gap:4px;flex-wrap:wrap}
.seg2 button{border:0;background:transparent;border-radius:8px;padding:4px 12px;font-weight:600;font-size:14px;color:var(--muted);min-height:32px}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------------- personas ---------------- */
  // m = metrics shown as evidence (first = main), src = source ids
  const PERSONAS = [
    // FAMILLE
    { k: 'f_calendrier', cat: 'famille', v: ['circle', '#FFD1A1', 'happy', 'cake'], m: ['celeb', 'greet'], src: ['dileonardo1987', 'rosenthal1985'],
      fr: { n: 'Le Gardien du Calendrier', d: 'Tient l’agenda affectif de la famille. Personne ne lui a demandé. Tout le monde compte dessus.', a: 'Rappelle l’anniversaire de mamie trois jours avant, la veille, puis le jour J à 7 h.', t: 'Tu fais le travail invisible du groupe. Cette année, délègue un anniversaire. Juste un. Observe.' },
      en: { n: 'The Calendar Keeper', d: 'Runs the family’s emotional calendar. Nobody asked. Everybody relies on it.', a: 'Reminds everyone of grandma’s birthday three days before, the day before, then at 7am on the day.', t: 'You do the group’s invisible work. This year, hand off one birthday. Just one. Watch what happens.' } },
    { k: 'f_forward', cat: 'famille', v: ['squircle', '#FFE36E', 'smug', 'newspaper'], m: ['link', 'avgW'], src: ['vosoughi2018', 'guess2019'],
      fr: { n: 'Le Forwardeur de chaînes', d: 'Partage plus de liens qu’il n’écrit de phrases. Certains datent de 2014. Tous sont « urgents ».', a: 'Transfère un article sur les dangers du micro-ondes avec « Faites tourner !!! ».', t: 'Avant de transférer, une question : est-ce que je l’aurais écrit moi-même ? Si non, garde-le.' },
      en: { n: 'The Chain Forwarder', d: 'Shares more links than sentences. Some date from 2014. All are “urgent”.', a: 'Forwards an article about microwave dangers with “Share this!!!”.', t: 'Before forwarding, ask: would I have written this myself? If not, keep it.' } },
    { k: 'f_bonjour', cat: 'famille', v: ['flower', '#FFE7A0', 'happy', 'mug'], m: ['greet', 'morning'], src: ['dunbar1996'],
      fr: { n: 'Le Réveil Matin', d: 'Ouvre la journée du groupe comme on ouvre un magasin. Tous les jours. Sans exception.', a: 'Poste « Bonjour tout le monde ☀️ » à 6 h 47, avec une photo de café.', t: 'Tes bonjours entretiennent le lien. Ajoute une question de temps en temps : c’est là que la conversation démarre.' },
      en: { n: 'The Morning Alarm', d: 'Opens the group’s day like opening a shop. Every day. No exceptions.', a: 'Posts “Good morning everyone ☀️” at 6:47am, with a coffee photo.', t: 'Your greetings keep the bond alive. Add a question now and then: that’s where conversations start.' } },
    { k: 'f_pompier', cat: 'famille', v: ['flame', '#FFB894', 'tired', 'none'], m: ['startShare', 'plan'], src: ['daminger2019', 'maslach2016'],
      fr: { n: 'Le Pompier', d: 'Rallume la conversation dès qu’elle s’éteint. Épuisé, mais toujours d’astreinte.', a: 'Relance le fil quand personne n’a parlé depuis quatre jours : « Tout le monde va bien ? »', t: 'Essaie une semaine sans relancer. Pas pour punir. Pour voir qui vient.' },
      en: { n: 'The Firefighter', d: 'Restarts the conversation the second it dies. Exhausted, but always on call.', a: 'Revives the thread after four silent days: “Is everyone ok?”', t: 'Try one week without following up. Not to punish. To see who shows up.' } },
    { k: 'f_fantome', cat: 'famille', v: ['ghost', '#D8C6FA', 'hollow', 'none'], m: ['med', 'share'], src: ['lefebvre2019', 'templeton2022'],
      fr: { n: 'Le Fantôme', d: 'Lit tout. Répond parfois. Réapparaît au repas de Noël comme si de rien n’était.', a: 'Répond « Ah désolé je viens de voir !! » à un message de mardi dernier.', t: 'Une note vocale de vingt secondes coûte moins cher qu’une excuse au prochain repas.' },
      en: { n: 'The Ghost', d: 'Reads everything. Replies sometimes. Reappears at Christmas dinner as if nothing happened.', a: 'Replies “Sorry just saw this!!” to a message from last Tuesday.', t: 'A twenty-second voice note costs less than an apology at the next dinner.' } },
    { k: 'f_conferencier', cat: 'famille', v: ['pill', '#FFB8DE', 'shout', 'megaphone'], m: ['avgW', 'qRate'], src: ['derber1979', 'huang2017'],
      fr: { n: 'Le Conférencier', d: 'Chaque message est un chapitre. Les questions aux autres sont en option, non incluse.', a: 'Répond à « ça va ? » par un récit en quatre paragraphes de sa semaine.', t: 'Une question par message. Une seule. Et lis la réponse jusqu’au bout.' },
      en: { n: 'The Lecturer', d: 'Every message is a chapter. Questions for others are an optional extra, not included.', a: 'Answers “how are you?” with a four-paragraph account of their week.', t: 'One question per message. Just one. And read the answer to the end.' } },
    { k: 'f_emoji', cat: 'famille', v: ['bean', '#D9F27A', 'laugh', 'balloon'], m: ['emoji', 'visual'], src: ['riordan2017'],
      fr: { n: 'L’Émoji Ambulant', d: 'Parle couramment le pictogramme. Les mots, c’est pour les grandes occasions.', a: 'Réagit à l’annonce d’un déménagement par 🏠📦😭😂🙏❤️.', t: 'Les émojis adoucissent tout. Mais une vraie phrase de temps en temps, ça fait l’effet d’un appel.' },
      en: { n: 'The Walking Emoji', d: 'Fluent in pictograms. Words are for special occasions.', a: 'Reacts to a moving announcement with 🏠📦😭😂🙏❤️.', t: 'Emojis soften everything. But a real sentence now and then lands like a phone call.' } },
    { k: 'f_cassepieds', cat: 'famille', v: ['triangle', '#FF9F9F', 'angry', 'bubble'], m: ['nag', 'qRate'], src: ['christensen1990', 'sacks1974'],
      fr: { n: 'Le Casse-Pieds', d: 'N’attend pas la réponse. Il la réclame. En plusieurs messages. Rapides.', a: 'Envoie « Alors ? », « ??? », puis « Bon, personne ne répond » en quatre minutes.', t: 'Un message, puis silence. Plus tu insistes, plus l’autre se retire : c’est documenté.' },
      en: { n: 'The Pest', d: 'Doesn’t wait for the answer. Demands it. In several quick messages.', a: 'Sends “So?”, “???”, then “Ok, nobody answers” within four minutes.', t: 'One message, then silence. The more you push, the more the other pulls away: it’s documented.' } },
    { k: 'f_observateur', cat: 'famille', v: ['squircle', '#A9D6FF', 'sideeye', 'sunglasses'], m: ['share', 'med'], src: ['nonnecke2000'],
      fr: { n: 'L’Observateur', d: 'Membre fantôme, mais qui lit tout. Absolument tout. Et s’en souvient.', a: 'Au repas : « Oui oui, j’ai vu dans le groupe. » N’a jamais écrit dans le groupe.', t: 'Tu lis tout mais on ne t’entend pas. Un « 👍 » compte déjà comme un signe de vie.' },
      en: { n: 'The Observer', d: 'Silent member who reads everything. Absolutely everything. And remembers.', a: 'At dinner: “Yes, I saw it in the group.” Has never written in the group.', t: 'You read it all but nobody hears you. A single “👍” already counts as a sign of life.' } },
    { k: 'f_insomniaque', cat: 'famille', v: ['cloud', '#C3B1FF', 'night', 'nightcap'], m: ['night', 'share'], src: ['exelmans2016', 'roenneberg2003'],
      fr: { n: 'L’Insomniaque', d: 'Écrit quand la maison dort. Ses idées arrivent à 2 h 47, en rafale.', a: 'Envoie « vous dormez ? » à 1 h 12. Personne ne répond. Il continue quand même.', t: 'Tes messages de nuit disent quelque chose de tes nuits. Coupe l’écran une heure avant de dormir, pour voir.' },
      en: { n: 'The Insomniac', d: 'Writes while the house sleeps. Ideas arrive at 2:47am, in bursts.', a: 'Sends “you guys asleep?” at 1:12am. Nobody answers. Keeps going anyway.', t: 'Your night messages say something about your nights. Try screens off an hour before bed.' } },
    // AMIS
    { k: 'a_cassecouilles', cat: 'amis', v: ['triangle', '#FF9F9F', 'angry', 'horns'], m: ['nag', 'qRate'], src: ['christensen1990', 'sacks1974'],
      fr: { n: 'Le Casse-Couilles', d: 'Relance, insiste, re-relance. Veut une réponse maintenant, et si possible hier.', a: 'Envoie « ??? » puis « allô » puis « bon ok » en 90 secondes.', t: 'Plus tu insistes, plus les autres se retirent. Un message, une question, et tu lâches ton téléphone.' },
      en: { n: 'The Pain in the Neck', d: 'Follows up, insists, follows up again. Wants an answer now, ideally yesterday.', a: 'Sends “???” then “hello?” then “ok fine” within 90 seconds.', t: 'The more you push, the more people retreat. One message, one question, then put the phone down.' } },
    { k: 'a_bizarre', cat: 'amis', v: ['bean', '#D9F27A', 'weird', 'antenna'], m: ['lsmGap', 'night'], src: ['ireland2011', 'gonzales2010'],
      fr: { n: 'Le Bizarre', d: 'Parle une langue voisine de celle du groupe. Proche, mais pas tout à fait.', a: 'Répond à un plan resto par un fait sur les pieuvres.', t: 'Ton style détonne. C’est ta signature. Reprends les mots des autres de temps en temps : ça rapproche.' },
      en: { n: 'The Weird One', d: 'Speaks a language next door to the group’s. Close, but not quite.', a: 'Answers a dinner plan with an octopus fact.', t: 'Your style stands out. It’s your signature. Echo others’ words now and then: it brings people closer.' } },
    { k: 'a_blagues', cat: 'amis', v: ['circle', '#FFE36E', 'grin', 'party'], m: ['laughRecv', 'link'], src: ['provine2000', 'martin2003'],
      fr: { n: 'Le Roi des blagues vaseuses', d: 'Lance des jeux de mots comme on lance des fléchettes. Étonnamment, ça touche.', a: 'Poste un calembour à 8 h, attend les « mdr » comme on attend des applaudissements.', t: 'Tu fais rire le groupe, c’est précieux. Vérifie juste que tout le monde est dans la blague, pas dessous.' },
      en: { n: 'The King of Bad Jokes', d: 'Throws puns like darts. Surprisingly, they land.', a: 'Posts a pun at 8am, then waits for the “lol”s like applause.', t: 'You make the group laugh, that’s precious. Just check everyone is in on the joke, not under it.' } },
    { k: 'a_rieur', cat: 'amis', v: ['flower', '#FFB8DE', 'laugh', 'none'], m: ['laugh', 'emoji'], src: ['provine2000'],
      fr: { n: 'Le Rieur', d: 'Ponctue tout d’un « mdr ». Le public idéal. Parfois un peu trop.', a: 'Répond « ptdr » à tout, y compris à « j’ai raté mon train ».', t: 'Ton rire nourrit le groupe. Quand quelqu’un partage un truc sérieux, remplace le « mdr » par une question.' },
      en: { n: 'The Laugher', d: 'Punctuates everything with “lol”. The ideal audience. Sometimes a bit too ideal.', a: 'Replies “lmao” to everything, including “I missed my train”.', t: 'Your laughter feeds the group. When someone shares something serious, swap the “lol” for a question.' } },
    { k: 'a_orga', cat: 'amis', v: ['squircle', '#BDF0A8', 'curious', 'clipboard'], m: ['plan', 'startShare'], src: ['daminger2019'],
      fr: { n: 'L’Organisateur', d: 'Transforme « faudrait qu’on se voie » en date, heure et lieu. Seul.', a: 'Crée un sondage pour choisir entre deux dates. Trois personnes votent. Sur huit.', t: 'Propose deux dates et une deadline. Sans réponse, tu réserves pour ceux qui ont répondu.' },
      en: { n: 'The Organiser', d: 'Turns “we should meet up” into a date, time and place. Alone.', a: 'Creates a poll between two dates. Three people vote. Out of eight.', t: 'Offer two dates and a deadline. No answer? Book for those who replied.' } },
    { k: 'a_retard', cat: 'amis', v: ['pill', '#FFD1A1', 'anxious', 'clock'], m: ['late', 'med'], src: ['buehler1994'],
      fr: { n: 'Le Retardataire', d: 'Vit dans un fuseau horaire décalé de vingt minutes. Toujours en route.', a: '« J’arrive dans 5 min » (envoyé à 20 h 12, arrivé à 20 h 51).', t: 'Ajoute 50 % à ton estimation. La science dit que tu sous-estimes. Tes amis aussi.' },
      en: { n: 'The Latecomer', d: 'Lives in a time zone twenty minutes behind. Always on the way.', a: '“5 min away” (sent at 8:12pm, arrived at 8:51pm).', t: 'Add 50% to your estimate. Science says you underestimate. So do your friends.' } },
    { k: 'a_ghosteur', cat: 'amis', v: ['ghost', '#D8C6FA', 'hollow', 'sunglasses'], m: ['med', 'share'], src: ['lefebvre2019', 'freedman2019', 'templeton2022'],
      fr: { n: 'Le Ghosteur', d: 'Disparaît sans prévenir. Revient sans s’excuser. Toujours cool.', a: 'Vu à 14 h 02. Répond trois jours plus tard avec un mème.', t: 'Tu n’as pas à répondre vite. Mais « je te réponds ce soir » évite que les autres se racontent des histoires.' },
      en: { n: 'The Ghoster', d: 'Vanishes without warning. Returns without apology. Always cool.', a: 'Seen at 2:02pm. Replies three days later with a meme.', t: 'You don’t have to reply fast. But “I’ll get back to you tonight” stops people writing stories in their heads.' } },
    { k: 'a_podcast', cat: 'amis', v: ['cloud', '#A9D6FF', 'tongue', 'headphones'], m: ['audio', 'share'], src: ['kruger2005'],
      fr: { n: 'Le Podcasteur', d: 'N’écrit pas, il enregistre. Des vocaux de 4 min 38, avec une intro.', a: 'Envoie un vocal pour dire « ok ». Puis un deuxième pour préciser.', t: 'Le vocal transmet le ton, c’est son super-pouvoir. Au-delà d’une minute, résume en une phrase écrite.' },
      en: { n: 'The Podcaster', d: 'Doesn’t type, records. 4:38 voice notes, with an intro.', a: 'Sends a voice note to say “ok”. Then another to clarify.', t: 'Voice carries tone, that’s its superpower. Past one minute, add a one-line written summary.' } },
    { k: 'a_noct', cat: 'amis', v: ['circle', '#C3B1FF', 'night', 'nightcap'], m: ['night', 'share'], src: ['exelmans2016', 'roenneberg2003'],
      fr: { n: 'Le Noctambule', d: 'Actif quand les autres dorment. Ses meilleures idées arrivent à 3 h.', a: 'Écrit « quelqu’un réveillé ? » puis raconte sa vie à un groupe endormi.', t: 'Tes nuits sont bavardes. Coupe l’écran une heure avant de dormir, une semaine, pour voir.' },
      en: { n: 'The Night Owl', d: 'Active while everyone sleeps. Best ideas land at 3am.', a: 'Writes “anyone awake?” then tells their life story to a sleeping group.', t: 'Your nights are chatty. Try screens off an hour before bed, for a week.' } },
    { k: 'a_effaceur', cat: 'amis', v: ['squircle', '#FFB8DE', 'cry', 'eraser'], m: ['del', 'share'], src: ['wang2011'],
      fr: { n: 'L’Effaceur', d: 'Écrit, regrette, supprime. Trente secondes trop tard : tout le monde a lu.', a: '« Ce message a été supprimé. » Le groupe entier : « on a vu ».', t: 'Si tu supprimes souvent, écris d’abord dans tes notes. Tu gagneras dix regrets par mois.' },
      en: { n: 'The Eraser', d: 'Writes, regrets, deletes. Thirty seconds too late: everyone read it.', a: '“This message was deleted.” The whole group: “we saw”.', t: 'If you delete a lot, draft in your notes first. Ten fewer regrets a month.' } },
    // COUPLE
    { k: 'k_romantique', cat: 'couple', v: ['flower', '#FFB8DE', 'happy', 'heart'], m: ['love', 'emoji'], src: ['floyd2006', 'riordan2017'],
      fr: { n: 'Le Romantique', d: 'Glisse un mot doux dans un message sur les poubelles. Le romantisme n’a pas d’horaires.', a: 'Termine « tu peux prendre du pain ? » par « mon cœur ❤️😘 ».', t: 'Tes mots doux nourrissent le lien, c’est prouvé. Un compliment précis vaut dix cœurs : dis ce que tu as aimé, pas juste que tu aimes.' },
      en: { n: 'The Romantic', d: 'Slips a sweet word into a message about the bins. Romance keeps no office hours.', a: 'Ends “can you grab bread?” with “love you ❤️😘”.', t: 'Your sweet words feed the bond, it’s documented. One specific compliment beats ten hearts: say what you liked, not just that you love.' } },
    { k: 'k_bonnenuit', cat: 'couple', v: ['cloud', '#C3B1FF', 'night', 'nightcap'], m: ['greet', 'night'], src: ['driver2004', 'dunbar1996'],
      fr: { n: 'Le Rituel Bonne Nuit', d: 'Ne s’endort jamais sans un dernier message. Même à trois mètres de l’autre.', a: 'Envoie « bonne nuit 😴 » depuis le canapé, l’autre est dans la chambre.', t: 'Les petits rituels sont des « invitations » au lien, et elles comptent. Demande-toi juste si l’autre y répond, ou s’il dort déjà.' },
      en: { n: 'The Goodnight Ritual', d: 'Never falls asleep without a last message. Even three metres away.', a: 'Sends “night night 😴” from the sofa while the other is in the bedroom.', t: 'Small rituals are “bids” for connection, and they matter. Just check the other one answers, or is already asleep.' } },
    { k: 'k_inquiet', cat: 'couple', v: ['triangle', '#FF9F9F', 'anxious', 'bubble'], m: ['nag', 'qRate'], src: ['christensen1990', 'sacks1974'],
      fr: { n: 'L’Inquiet', d: 'Deux coches bleues, pas de réponse : le scénario catastrophe est déjà écrit.', a: '« Tu es arrivé·e ? » puis « ??? » puis « bon tu me dis » en quatre minutes.', t: 'Plus l’un insiste, plus l’autre se retire : c’est le schéma le mieux documenté des couples. Un message, puis tu poses le téléphone.' },
      en: { n: 'The Worrier', d: 'Two blue ticks, no reply: the disaster scenario is already written.', a: '“Did you get there?” then “???” then “ok let me know” within four minutes.', t: 'The more one pushes, the more the other pulls away: the best-documented pattern in couples. One message, then put the phone down.' } },
    { k: 'k_distant', cat: 'couple', v: ['ghost', '#D8C6FA', 'sideeye', 'sunglasses'], m: ['med', 'share'], src: ['lefebvre2019', 'templeton2022'],
      fr: { n: 'Le Distant', d: 'Lit, réfléchit, répond trois heures plus tard. Par « ok ».', a: 'Vu à 12 h 04. Répond à 17 h 30 : « ah oui pourquoi pas ».', t: 'Tu n’as pas à répondre vite. Mais un « je te réponds ce soir » évite à l’autre d’écrire un roman dans sa tête.' },
      en: { n: 'The Distant One', d: 'Reads, ponders, replies three hours later. With “ok”.', a: 'Seen at 12:04pm. Replies at 5:30pm: “oh yeah why not”.', t: 'You don’t have to reply fast. But “I’ll answer tonight” stops the other from writing a novel in their head.' } },
    { k: 'k_eclair', cat: 'couple', v: ['pill', '#BDF0A8', 'wink', 'phone'], m: ['med', 'startShare'], src: ['templeton2022'],
      fr: { n: 'L’Hyper-Réactif', d: 'Répond avant la fin de la notification. Le téléphone ne quitte jamais sa main.', a: 'Répond en 6 secondes, en pleine réunion, avec trois émojis.', t: 'Répondre vite signale l’attention, la recherche le confirme. Garde quand même des moments sans écran : la présence compte aussi.' },
      en: { n: 'The Instant Replier', d: 'Replies before the notification finishes. The phone never leaves their hand.', a: 'Replies in 6 seconds, mid-meeting, with three emojis.', t: 'Fast replies signal attention, research agrees. Still keep some screen-free time: presence counts too.' } },
    { k: 'k_logistique', cat: 'couple', v: ['squircle', '#FFE36E', 'curious', 'clipboard'], m: ['home', 'plan'], src: ['daminger2019'],
      fr: { n: 'Le Logisticien du foyer', d: 'Pense aux courses, au loyer, au rendez-vous véto. La conversation, c’est une to-do list partagée.', a: '« On mange quoi ce soir ? » « Pense au lait. » « La facture EDF est arrivée. »', t: 'Tu portes la charge mentale du foyer, et elle est invisible. Partagez une liste commune : l’autre ne pourra plus dire qu’il ne savait pas.' },
      en: { n: 'The Household Manager', d: 'Remembers groceries, rent, the vet. The chat is a shared to-do list.', a: '“What’s for dinner?” “Get milk.” “The electricity bill came.”', t: 'You carry the household’s mental load, and it’s invisible. Share a common list: the other can’t say they didn’t know anymore.' } },
    { k: 'k_vocal', cat: 'couple', v: ['cloud', '#A9D6FF', 'tongue', 'mic'], m: ['audio', 'share'], src: ['kruger2005'],
      fr: { n: 'Le Vocal', d: 'Ne tape pas, raconte. Des vocaux de deux minutes pour dire « j’arrive ».', a: 'Envoie un vocal de 2 min 40 depuis le métro. On entend surtout le métro.', t: 'La voix transmet la tendresse mieux que l’écrit. Pour les infos pratiques, une ligne écrite se relit plus facilement.' },
      en: { n: 'The Voice Noter', d: 'Doesn’t type, tells. Two-minute voice notes to say “on my way”.', a: 'Sends a 2:40 voice note from the subway. Mostly subway.', t: 'Voice carries warmth better than text. For practical info, one written line is easier to find later.' } },
    { k: 'k_pave', cat: 'couple', v: ['pill', '#FFD1A1', 'tired', 'glasses'], m: ['avgW', 'qRate'], src: ['huang2017', 'derber1979'],
      fr: { n: 'Le Pavé', d: 'Chaque message est une lettre. Avec introduction, développement, et « bref ».', a: 'Répond à « ça va ? » par douze lignes et un post-scriptum.', t: 'Tes longs messages montrent que tu t’investis. Termine-les par une question : l’autre saura quoi répondre.' },
      en: { n: 'The Essayist', d: 'Every message is a letter. Intro, body, and “anyway”.', a: 'Answers “how are you?” with twelve lines and a P.S.', t: 'Your long messages show you care. End them with a question: the other will know how to reply.' } },
    { k: 'k_laconique', cat: 'couple', v: ['squircle', '#B7C4FF', 'serious', 'none'], m: ['dry', 'avgW'], src: ['gunraj2016'],
      fr: { n: 'Le Laconique', d: 'Trois lettres par message, point final compris. L’efficacité avant tout.', a: 'Répond « ok. » à « je t’ai préparé une surprise ».', t: 'Ton « ok. » est lu plus froid que tu ne le penses : c’est mesuré. Ajoute un mot, un émoji, n’importe quoi de chaud.' },
      en: { n: 'The Laconic One', d: 'Three letters per message, full stop included. Efficiency first.', a: 'Replies “ok.” to “I’ve prepared a surprise for you”.', t: 'Your “ok.” reads colder than you think: it’s been measured. Add a word, an emoji, anything warm.' } },
    { k: 'k_clown', cat: 'couple', v: ['circle', '#FFE36E', 'grin', 'party'], m: ['laughRecv', 'laugh'], src: ['martin2003', 'provine2000'],
      fr: { n: 'Le Clown du couple', d: 'Désamorce tout par une blague. Même les disputes. Surtout les disputes.', a: 'Envoie un mème de chat au milieu d’un débat sur les vacances.', t: 'L’humour qui rapproche protège le couple. Vérifie juste qu’il ne sert pas à esquiver les sujets qui comptent.' },
      en: { n: 'The Couple’s Clown', d: 'Defuses everything with a joke. Even fights. Especially fights.', a: 'Drops a cat meme in the middle of a holiday debate.', t: 'Bonding humour protects a couple. Just check it’s not a way to dodge the topics that matter.' } },
    // COLLEGUES
    { k: 'c_dimanche', cat: 'collegues', v: ['squircle', '#B7C4FF', 'smug', 'phone'], m: ['off', 'startShare'], src: ['barber2015', 'loi2016'],
      fr: { n: 'Le Boss du dimanche', d: 'Ne connaît pas les horaires. Le week-end est un jour ouvré comme un autre.', a: 'Envoie « petite question rapide » un dimanche à 21 h 40.', t: 'Programme tes messages pour lundi 9 h. Même idée, zéro culpabilité chez les autres.' },

async function nativeUnzip(file) {

    const buf = new Uint8Array(await file.arrayBuffer()), dv = new DataView(buf.buffer);
    let eocd = -1;

    const dec = new TextDecoder(), entries = [];

      if (dv.getUint32(off, true) !== 0x02014b50) return null;

      const nl = dv.getUint16(off + 28, true), el = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true), lho = dv.getUint32(off + 42, true);
      entries.push({ name: dec.decode(buf.subarray(off + 46, off + 46 + nl)), method, csize, usize, lho });
      off += 46 + nl + el + cl;
    }
    const txts = entries.filter(e => /\.txt$/i.test(e.name) && !e.name.startsWith('__MACOSX'));
    if (!txts.length) throw new Error('nozip');
    const e = txts.find(x => /_chat\.txt$|whatsapp/i.test(x.name)) || txts.sort((a, b) => b.usize - a.usize)[0];
    const start = e.lho + 30 + dv.getUint16(e.lho + 26, true) + dv.getUint16(e.lho + 28, true);
    const data = buf.subarray(start, start + e.csize);
    if (e.method === 0) return dec.decode(data);

    return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  } catch (err) { if (err.message === 'nozip') throw err; return null; }
}
async function handleFile(file) {

    if (!isZip && /\.(jpe?g|png|gif|webp|heic|pdf|mp4|mov|opus|m4a)$/i.test(name)) throw new Error('type');

      if (!txts.length) throw new Error('nozip');

}

const pdfSafe = s => String(s).replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-').replace(/…/g, '...').replace(/œ/g, 'oe').replace(/Œ/g, 'OE').replace(/→/g, '->').replace(/·/g, '-').replace(/×/g, 'x').replace(/[\u202f\u00a0]/g, ' ').replace(/[^\x20-\x7E\xA0-\xFF]/g, '');
const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function svgPng(svg, px) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = px; c.getContext('2d').drawImage(img, 0, 0, px, px); res(c.toDataURL('image/png')); };
    img.onerror = () => res(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace('<svg ', `<svg xmlns="http://www.w3.org/2000/svg" width="${px}" height="${px}" `));
  });
}

    section(t('bib_t'), t('meth_caveat'));
    [...srcNum.entries()].forEach(([id, n]) => {
      const l = lines(SRC[id][0], CW - 10, 'normal', 8.3), s2 = lines(SRC[id][lang === 'fr' ? 1 : 2], CW - 10, 'italic', 8);
      ensure(l.length * lh(8.3) + s2.length * lh(8) + 4);
      setF('bold', 8.3); write(`[${n}]`, M, y);
      setF('normal', 8.3); write(l, M + 10, y); y += l.length * lh(8.3);
      setF('italic', 8, MUT); write(s2, M + 10, y); y += s2.length * lh(8) + 3;
    });

    // footers
    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i);
      doc.setDrawColor(227, 218, 240); doc.setLineWidth(.3); doc.line(M, PH - 12, PW - M, PH - 12);
      setF('normal', 7, MUT);
      write(doc.splitTextToSize(pdfSafe(t('pdf_note')), CW - 20), M, PH - 8);
      setF('bold', 7.5, MUT); write(`${i} / ${n}`, PW - M, PH - 8, { align: 'right' });
    }
    await offerFile(`whichoneareyou-${slug(state.anon ? 'rapport' : state.title)}.pdf`, doc.output('blob'));
  } catch (e) { console.error(e); toast(t('t_err_pdf')); }
  finally { btn.disabled = false; }
}

/* ================= NAV / MISC ================= */
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.lang === lang) return;
  lang = b.dataset.lang; try { localStorage.setItem('dc_lang', lang); } catch (e) {}
  nameMap.clear(); applyStatic();
  if (state.src === 'demo' && state.stats) { state.cpl = null; const d = state.demoKind === 'couple' ? demoCouple(lang) : demo(lang); const prevMe = state.me ? state.stats.people.findIndex(p => p.name === state.me) : -1; state.msgs = parse(d.text); state.title = d.title; state.stats = analyze(state.msgs); if (prevMe >= 0) state.me = state.stats.people[prevMe].name; assign(state.stats, state.cat); state.duelA = state.me || state.stats.people[0].name; state.duelB = state.stats.people.find(p => p.name !== state.duelA).name; }
  if (quiz.classList.contains('show')) renderQuiz();
  if (state.stats && dash.classList.contains('show')) renderDash();
}));
$('#artCats').addEventListener('click', e => { const b = e.target.closest('[data-cat]'); if (!b) return; state.castTab = b.dataset.cat; renderCast(); document.getElementById('casting').scrollIntoView({ behavior: 'smooth' }); });
$('#collage').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  state.castTab = BY_KEY[b.dataset.k].cat; renderCast();
  document.getElementById('casting').scrollIntoView({ behavior: 'smooth' });
});
const tabIos = $('#tabIos'), tabAnd = $('#tabAnd');
function setTab(ios) { tabIos.setAttribute('aria-selected', ios); tabAnd.setAttribute('aria-selected', !ios); $('#stepsIos').hidden = !ios; $('#stepsAnd').hidden = ios; }
tabIos.addEventListener('click', () => setTab(true)); tabAnd.addEventListener('click', () => setTab(false));
if (/android/i.test(navigator.userAgent)) setTab(false);

applyStatic();
})();
</script>
