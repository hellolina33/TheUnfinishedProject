<style>
/* Layout: a scroll story. A sticky life grid (left on desktop, top on phone) re-colours itself as ten personal scenes scroll past; reference sections follow. */
:root {
  --bg: #f3f5f8;
  --paper: #ffffff;
  --ink: #0e1a2b;
  --muted: #576477;
  --line: #d8dee6;
  --c-blank: #e0e5ec;
  --c-lived: #b2bdcb;
  --c-left: #0e1a2b;
  --accent: #ff4a1c;
  --accent-ink: #ffffff;
  --err: #c0311a;
  --f-display: "Bricolage Grotesque", "Arial Narrow", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
  --bar-h: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1320;
    --paper: #111c2c;
    --ink: #e8eef6;
    --muted: #93a1b4;
    --line: #22314a;
    --c-blank: #1a2639;
    --c-lived: #3a4c66;
    --c-left: #e8eef6;
    --accent: #ff6a3d;
    --accent-ink: #0b1320;
    --err: #ff8f73;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1320;
  --paper: #111c2c;
  --ink: #e8eef6;
  --muted: #93a1b4;
  --line: #22314a;
  --c-blank: #1a2639;
  --c-lived: #3a4c66;
  --c-left: #e8eef6;
  --accent: #ff6a3d;
  --accent-ink: #0b1320;
  --err: #ff8f73;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--bg);
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.gutter {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar-in { max-width: 1240px; margin: 0 auto; height: var(--bar-h); display: flex; align-items: center; gap: 12px; }
.brand {
  display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink);
  font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap;
}
.logo { width: 16px; height: 16px; flex: none; }
.logo rect { fill: var(--ink); }
.logo .lv { fill: var(--c-lived); }
.logo .nw { fill: var(--accent); }
.day { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.nav { display: none; gap: 2px; margin-left: auto; }
.nav a { font-size: 14px; color: var(--muted); text-decoration: none; padding: 8px 10px; border-radius: 8px; }
.nav a:hover { color: var(--ink); background: var(--paper); }
.seg { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; flex: none; }
.seg button {
  font: inherit; font-family: var(--f-mono); font-size: 12px; min-height: 32px; min-width: 40px; padding: 0 10px;
  border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
@media (min-width: 900px) {
  .nav { display: flex; }
  .seg { margin-left: 8px; }
}
@media (max-width: 560px) { .day { display: none; } }
.brand { min-width: 0; }
.brand span { overflow: hidden; text-overflow: ellipsis; }

/* ---------- Story ---------- */
.story { max-width: 1240px; margin: 0 auto; }
.viz-col {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h)); z-index: 10;
  height: 48vh; height: 48svh;
  background: var(--bg); border-bottom: 1px solid var(--line);
  padding-block: 10px 8px;
}
.viz { height: 100%; display: flex; flex-direction: column; gap: 6px; }
.viz-head { display: flex; align-items: center; gap: 10px; min-height: 24px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.step { font-variant-numeric: tabular-nums; }
.viz-title { color: var(--ink); font-weight: 500; }
.pill {
  font-family: var(--f-mono); font-size: 11px; line-height: 1; padding: 5px 8px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink);
}
.stage { position: relative; flex: 1; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; cursor: crosshair; }
.tip {
  position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; max-width: 230px;
  background: var(--ink); color: var(--bg); padding: 8px 10px; border-radius: 8px;
  font-size: 12px; line-height: 1.4;
}
.tip b { display: block; font-size: 13px; }
.tip .hl { color: var(--accent); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; min-height: 18px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.sw.blank { background: var(--c-blank); }
.sw.lived { background: var(--c-lived); }
.sw.left { background: var(--c-left); }
.sw.accent { background: var(--accent); }
.sw.now { background: var(--accent); box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 3px var(--ink); }
.sw.ring { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }

.scenes { position: relative; z-index: 1; }
.scene {
  min-height: 72vh; min-height: 72svh;
  padding-block: 28px 48px;
  scroll-margin-top: calc(var(--bar-h) + 48vh);
}
.kick { margin: 0 0 12px; font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.04em; color: var(--muted); font-variant-numeric: tabular-nums; }
.say {
  margin: 0; font-family: var(--f-display); font-weight: 700; font-stretch: 88%;
  font-size: clamp(28px, 6.6vw, 46px); line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance;
}
.say .n { color: var(--accent); font-variant-numeric: tabular-nums; }
.say s { text-decoration-thickness: 3px; color: var(--muted); }
.body { margin: 14px 0 0; max-width: 46ch; font-size: 17px; color: var(--muted); }
.body .n { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

/* Hero scene */
.scene-you { min-height: 0; padding-top: 22px; }
.h1 {
  margin: 8px 0 0; font-family: var(--f-display); font-weight: 800; font-stretch: 78%;
  font-size: clamp(38px, 9vw, 66px); line-height: 0.98; letter-spacing: -0.03em; text-wrap: balance;
}
.lead { margin: 14px 0 0; max-width: 46ch; color: var(--muted); font-size: 17px; }
.panel {
  margin-top: 22px; padding: 16px; display: grid; gap: 14px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
}
.form { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 520px) { .form { grid-template-columns: 1fr 1fr; } }
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.label { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
input[type="date"], input[type="number"], input[type="text"] {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; min-height: 46px; padding: 0 12px;
  width: 100%; min-width: 0;
}
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
.life { display: grid; grid-template-columns: 1fr 84px; gap: 10px; align-items: center; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.err { margin: 0; font-size: 14px; font-weight: 700; color: var(--err); }
.err:empty { display: none; }
.note { margin: 16px 0 0; padding: 10px 12px; font-size: 14px; border: 1px dashed var(--accent); border-radius: 10px; background: var(--paper); }
.answer { margin-top: 26px; }
.big {
  margin: 0; font-family: var(--f-display); font-weight: 800; font-stretch: 75%;
  font-size: clamp(76px, 23vw, 152px); line-height: 0.86; letter-spacing: -0.045em; font-variant-numeric: tabular-nums;
}
.unit { margin: 8px 0 0; font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
.sub { margin: 4px 0 0; color: var(--muted); }
.start {
  display: inline-flex; align-items: center; min-height: 46px; margin-top: 22px; padding: 0 20px;
  border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 700; text-decoration: none;
}
.privacy-line { margin: 12px 0 0; font-size: 13px; color: var(--muted); }

/* Tools inside scenes */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 15px; min-height: 42px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 12px; align-items: center; }
.result { margin: 0; font-size: 17px; }
.result .n { font-family: var(--f-display); font-weight: 800; font-size: 1.45em; color: var(--accent); font-variant-numeric: tabular-nums; }
.btn {
  font: inherit; font-size: 15px; font-weight: 700; min-height: 46px; padding: 0 18px;
  border: 0; border-radius: 12px; background: var(--ink); color: var(--bg); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.mini {
  font: inherit; font-size: 13px; min-height: 36px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
}
.mini.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.add summary { cursor: pointer; font-weight: 700; min-height: 36px; display: flex; align-items: center; }
.add-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px auto; gap: 8px; align-items: end; margin-top: 10px; }
@media (max-width: 460px) { .add-row { grid-template-columns: minmax(0, 1fr) 84px; } .add-row .btn { grid-column: 1 / -1; } }
.goals { list-style: none; margin: 0; padding: 0; }
.goals li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.goals .t { font-weight: 700; overflow-wrap: anywhere; }
.goals .m { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.goals .done .t { text-decoration: line-through; color: var(--muted); }
.goals .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.quote { margin: 0 0 22px; }
.quote p { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: clamp(21px, 4.4vw, 28px); line-height: 1.2; text-wrap: balance; }
.quote footer { margin-top: 8px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.card-img { display: block; width: 100%; max-width: 360px; height: auto; border-radius: 12px; border: 1px solid var(--line); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

@media (min-width: 900px) {
  .story { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: 56px; align-items: start; }
  .viz-col { height: calc(100vh - var(--bar-h)); height: calc(100svh - var(--bar-h) - env(safe-area-inset-top, 0px)); border-bottom: 0; padding-block: 22px 18px; }
  .scene { min-height: 88vh; min-height: 88svh; display: flex; flex-direction: column; justify-content: center; scroll-margin-top: var(--bar-h); }
  .scene-you { min-height: calc(100svh - var(--bar-h)); }
}

/* ---------- Reference sections ---------- */
.page { max-width: 1240px; margin: 0 auto; }
.sec {
  padding-block: 56px; border-top: 1px solid var(--line); display: grid; gap: 18px;
  scroll-margin-top: calc(var(--bar-h) + 12px);
}
@media (min-width: 900px) { .sec { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 48px; } }
.sec h2 {
  margin: 0; font-family: var(--f-display); font-weight: 800; font-stretch: 80%;
  font-size: clamp(30px, 5vw, 42px); line-height: 1; letter-spacing: -0.02em;
}
.sec .content { min-width: 0; max-width: 64ch; }
.sec .content > p { margin: 0 0 14px; }
.defs { margin: 0; display: grid; gap: 0; }
.defs div { padding: 14px 0; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.defs dt { font-weight: 700; }
.defs dd { margin: 0; color: var(--muted); }
.srcs { list-style: none; margin: 0; padding: 0; }
.srcs li { padding: 14px 0; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.srcs .st { font-weight: 700; }
.srcs .sd { color: var(--muted); }
.srcs a { font-family: var(--f-mono); font-size: 13px; overflow-wrap: anywhere; }
.faq details { border-top: 1px solid var(--line); padding: 12px 0; }
.faq summary { cursor: pointer; font-weight: 700; min-height: 32px; display: flex; align-items: center; }
.faq details p { margin: 8px 0 0; color: var(--muted); }
.status { font-size: 14px; color: var(--muted); margin: 10px 0 0; }

.foot { max-width: 1240px; margin: 0 auto; padding-block: 28px calc(28px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--muted); }
.foot a { color: var(--ink); }
.foot nav { display: flex; flex-wrap: wrap; gap: 8px 14px; }
</style>

</head>
<body>
<header class="bar">
  <div class="bar-in gutter">
    <a class="brand" href="#top">
      <svg class="logo" viewBox="0 0 16 16" aria-hidden="true">
        <rect class="lv" x="0" y="0" width="4" height="4"/><rect class="lv" x="6" y="0" width="4" height="4"/><rect class="lv" x="12" y="0" width="4" height="4"/>
        <rect class="lv" x="0" y="6" width="4" height="4"/><rect class="nw" x="6" y="6" width="4" height="4"/><rect x="12" y="6" width="4" height="4"/>
        <rect x="0" y="12" width="4" height="4"/><rect x="6" y="12" width="4" height="4"/><rect x="12" y="12" width="4" height="4"/>
      </svg>
      <span data-i18n="brand">Combien de semaines</span>
    </a>
    <a class="day" href="https://the-unfinished-30.vercel.app/" style="text-decoration:none" data-i18n="dayTag">Jour 02 / 30</a>
    <nav class="nav" aria-label="Sections">
      <a href="#histoire" data-i18n="navStory">Histoire</a>
      <a href="#methode" data-i18n="navMethod">Méthode</a>
      <a href="#sources" data-i18n="navSources">Sources</a>
      <a href="#confidentialite" data-i18n="navPrivacy">Confidentialité</a>
      <a href="#faq" data-i18n="navFaq">FAQ</a>
    </nav>
    <div class="seg" role="group" aria-label="Langue / Language">
      <button id="lang-en" type="button" aria-pressed="true">EN</button>
      <button id="lang-fr" type="button" aria-pressed="false">FR</button>
    </div>
  </div>
</header>

<main id="top">
  <section class="story gutter" id="histoire">
    <div class="viz-col">
      <div class="viz">
        <div class="viz-head">
          <span id="viz-step" class="step">01 / 10</span>
          <span id="viz-title" class="viz-title"></span>
          <span id="viz-example" class="pill" hidden></span>
        </div>
        <div id="stage" class="stage">
          <canvas id="cv" role="img" aria-label=""></canvas>
          <div id="tip" class="tip" hidden></div>
        </div>
        <div id="legend" class="legend"></div>
      </div>
    </div>

    <div class="scenes">
      <article class="scene scene-you" data-scene="you" id="s-you">
        <p class="kick" data-i18n="kicker">The Unfinished 30 · Jour 02 sur 30</p>
        <h1 class="h1" data-i18n="h1">Combien de semaines il te reste ?</h1>
        <p class="lead" data-i18n="lead"></p>
        <div class="panel">
          <div class="form">
            <div class="field">
              <label class="label" for="birth" data-i18n="lblBirth"></label>
              <input id="birth" type="date" min="1900-01-01">
            </div>
            <div class="field">
              <label class="label" for="life-num" data-i18n="lblLife"></label>
              <div class="life">
                <input id="life-range" type="range" min="50" max="110" step="1" value="80">
                <input id="life-num" type="number" min="50" max="110" step="1" value="80" inputmode="numeric">
              </div>
            </div>
          </div>
          <p class="hint" data-i18n="lifeHint"></p>
          <p id="hero-err" class="err" role="alert"></p>
        </div>
        <p id="example-note" class="note" data-i18n="example" hidden></p>
        <div class="answer" aria-live="polite">
          <p id="hero-big" class="big">0</p>
          <p id="hero-unit" class="unit"></p>
          <p id="hero-sub" class="sub"></p>
        </div>
        <a class="start" href="#s-life" data-i18n="start"></a>
        <p class="privacy-line" data-i18n="privacyShort"></p>
      </article>

      <article class="scene" data-scene="life" id="s-life">
        <p class="kick" data-kick></p>
        <h2 class="say" id="h-life"></h2>
        <p class="body" id="p-life"></p>
      </article>

      <article class="scene" data-scene="lived" id="s-lived">
        <p class="kick" data-kick></p>
        <h2 class="say" id="h-lived"></h2>
        <p class="body" id="p-lived"></p>
      </article>

      <article class="scene" data-scene="left" id="s-left">
        <p class="kick" data-kick></p>
        <h2 class="say" id="h-left"></h2>
        <p class="body" id="p-left"></p>
      </article>

      <article class="scene" data-scene="rows" id="s-rows">
        <p class="kick" data-kick></p>
        <h2 class="say" id="h-rows"></h2>
        <p class="body" id="p-rows"></p>
      </article>

      <article class="scene" data-scene="feel" id="s-feel">
        <p class="kick" data-kick></p>
        <h2 class="say" id="h-feel"></h2>
        <p class="body" id="p-feel"></p>
      </article>

      <article class="scene" data-scene="times" id="s-times">
        <p class="kick" data-kick></p>
        <h2 class="say" id="h-times"></h2>
        <p class="body" id="p-times"></p>
        <div class="panel">
          <div id="chips" class="chips" role="group"></div>
          <div id="freq-row" class="row2">
            <label id="freq-lbl" class="label" for="freq"></label>
            <input id="freq" type="number" min="0" max="365" step="1" inputmode="numeric">
          </div>
          <div id="parent-row" class="field" hidden>
            <div class="row2">
              <label class="label" for="parent-age" data-i18n="parentLbl"></label>
              <input id="parent-age" type="number" min="15" max="120" step="1" inputmode="numeric">
            </div>
            <p class="hint" id="parent-hint"></p>
          </div>
          <p id="moment-result" class="result" aria-live="polite"></p>
          <div class="actions"><button id="moment-remove" class="mini" type="button" hidden data-i18n="removeMoment"></button></div>
          <details class="add" id="add-details">
            <summary data-i18n="addMoment"></summary>
            <form id="add-form" novalidate>
              <div class="add-row">
                <div class="field"><label class="label" for="add-name" data-i18n="addName"></label><input id="add-name" type="text" maxlength="30" autocomplete="off"></div>

  var DEFAULT_MOMENTS = [

    var total = lifespan * WPY;
    var left = Math.max(0, total - lived);
    return {

      age: Math.floor(lived / WPY),

      case "left":

        break;

  function legendFor(scene, c) {

    state.items.forEach(function (it) {
      if (!it.done && goalWeek(it.age) === i) html += '<br><span class="hl">' + esc(fill(tx.tipGoal, { t: it.title })) + "</span>";
    });
    ui.hover = i;
    dom.tip.innerHTML = html;
    dom.tip.hidden = false;
    var sw = dom.stage.clientWidth, sh = dom.stage.clientHeight, tw = dom.tip.offsetWidth, th = dom.tip.offsetHeight;
    var left = Math.min(Math.max(4, px + 14), sw - tw - 4);
    var top = py - th - 12;
    if (top < 4) top = py + 16;
    dom.tip.style.left = left + "px";
    dom.tip.style.top = Math.min(Math.max(4, top), Math.max(4, sh - th - 4)) + "px";
    draw();
  }

  function hideTip() {

    dom.tip.hidden = true;

  function pointerPos(e) {

  // ---------- Scene tracking ----------
  function pickScene() {
    var line = window.innerHeight * (isWide() ? 0.55 : 0.74);
    var cur = SCENES[0];
    for (var k = 0; k < dom.scenes.length; k++) {
      if (dom.scenes[k].getBoundingClientRect().top <= line) cur = dom.scenes[k].getAttribute("data-scene");
    }

  function renderVizHead() {

    var idx = SCENES.indexOf(ui.scene);
    dom.vizStep.textContent = p2(idx + 1) + " / " + p2(SCENES.length);
    dom.vizTitle.textContent = tx.titles[ui.scene];

  // ---------- Text ----------
  function walkText(weeks) {
    var tx = t(), mins = weeks / STEPS_PER_MIN;
    if (mins >= 60) return fill(tx.walkHour, { h: Math.floor(mins / 60), m: Math.round(mins % 60) });
    var m = Math.floor(mins), s = Math.round((mins - m) * 60);
    if (s === 60) { m += 1; s = 0; }
    return fill(tx.walkMin, { m: m, s: s });
  }

  function renderHero(c) {
    var tx = t();
    dom.exampleNote.hidden = !!state.birth;
    if (c.over) {
      dom.heroBig.textContent = "0";
      dom.heroUnit.textContent = tx.unit;
      dom.heroSub.textContent = tx.subOver;
    } else {
      dom.heroBig.textContent = fmt(c.left);
      dom.heroUnit.textContent = tx.unit;
      dom.heroSub.textContent = fill(tx.sub, { y: fmt1(c.left / WPY), n: fmt(c.lived + 1) });

  function renderScenes(c) {
    var tx = t();
    var wd = weekDates(effectiveBirth(), c.lived);
    var workEnd = Math.min(WORK_END, state.lifespan);
    var workWeeks = Math.max(0, workEnd - WORK_START) * WPY;
    var adultWeeks = Math.max(1, state.lifespan - ADULT) * WPY;
    var workLeft = Math.max(0, Math.min(workEnd * WPY, c.total) - Math.max(c.lived, WORK_START * WPY));
    var v = {
      L: state.lifespan, total: fmt(c.total), lived: fmt(c.lived), left: fmt(c.left),
      pct: fmt1(c.pct), d1: fmtDate(wd.start), d2: fmtDate(wd.end), walk: walkText(c.left),
      work: fmt(workWeeks), workPct: fmt(workWeeks / adultWeeks * 100), workLeft: fmt(workLeft),
      age: c.age, p: c.age > 0 ? fmt1(100 / c.age) : "100"
    };

    // Scene kickers: "02 · A life"
    dom.kicks.forEach(function (k) {
      var sc = k.parentNode.getAttribute("data-scene");
      k.textContent = p2(SCENES.indexOf(sc) + 1) + " · " + tx.titles[sc];
    });

    $("h-life").innerHTML = fillN(tx.h.life, v);
    $("p-life").innerHTML = fillN(tx.p.life, v);
    $("h-lived").innerHTML = fillN(tx.h.lived, v);
    $("p-lived").innerHTML = c.over ? fillN(tx.p.leftOver, v) : fillN(tx.p.lived, v);
    $("h-left").innerHTML = c.over ? fillN(tx.h.leftOver, v) : fillN(tx.h.left, v);
    $("p-left").innerHTML = c.over ? fillN(tx.p.leftOver, v) : fillN(tx.p.left, v);
    $("h-rows").innerHTML = fillN(tx.h.rows, v);
    $("p-rows").innerHTML = fillN(tx.p.rows, v) + (c.age < WORK_END && workLeft > 0 ? fillN(tx.p.rowsLeft, v) : "");
    $("h-feel").innerHTML = fillN(tx.h.feel, v);
    $("p-feel").innerHTML = c.age > 10 ? fillN(tx.p.feel, v) : fillN(tx.p.feelYoung, v);
    $("h-times").innerHTML = tx.h.times;
    $("p-times").innerHTML = fillN(tx.p.times, v);
    $("h-last").innerHTML = fillN(tx.h.last, v);
    $("p-last").innerHTML = fillN(tx.p.last, v);
    $("h-choose").innerHTML = fillN(tx.h.choose, v);
    $("p-choose").innerHTML = fillN(tx.p.choose, v);
    $("h-card").innerHTML = fillN(tx.h.card, v);
    $("p-card").innerHTML = fillN(tx.p.card, v);
    dom.cardBig.textContent = c.over ? "0" : fmt(c.left);
  }

  function renderTimes(c) {
    var tx = t();
    var m = activeMoment();
    state.active = m.id;
    dom.chips.replaceChildren();
    state.moments.forEach(function (mm) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = momentName(mm);
      b.setAttribute("aria-pressed", mm.id === m.id ? "true" : "false");
      b.addEventListener("click", function () {
        state.active = mm.id; save(); renderTimes(current()); renderVizHead(); setTargets(false);
      });
      dom.chips.appendChild(b);
    });
    dom.chips.setAttribute("aria-label", tx.titles.times);

    var isCustom = !(m.id in tx.moments);
    dom.freqRow.hidden = !!m.fixed;
    dom.freqLbl.textContent = isCustom ? tx.freq.custom : (tx.freq[m.id] || tx.freq.custom);
    if (document.activeElement !== dom.freq) dom.freq.value = String(m.f);
    dom.parentRow.hidden = m.id !== "parents";
    if (m.id === "parents") {
      dom.parentHint.textContent = fill(tx.parentHint, { a: Math.min(110, c.age + 30) });
      if (document.activeElement !== dom.parentAge) dom.parentAge.value = state.parentAge != null ? String(state.parentAge) : "";
      dom.parentAge.placeholder = String(Math.min(110, c.age + 30));
    }
    dom.momentRemove.hidden = !isCustom;

    var cnt = momentCount(m, c, state.lifespan, parentAgeFor(c));
    var html;
    if (m.id === "summers") html = fillN(tx.res.summers, { n: fmt(cnt.n) });
    else if (m.id === "sea") html = fillN(tx.res.sea, { n: fmt(cnt.n) });
    else if (m.id === "books") {
      html = fillN(tx.res.books, { n: fmt(cnt.n) });
      if (m.f > 0) html += fillN(tx.res.booksWorld, { lives: fmt(BOOKS_WORLD / (m.f * state.lifespan)) });
    } else if (m.id === "parents") {
      if (cnt.horizon <= 0) html = esc(tx.res.parentsNone);
      else {
        html = fillN(tx.res.parents, { n: fmt(cnt.n) });
        if (cnt.pct !== null) html += fillN(tx.res.parentsPct, { pct: fmt1(Math.min(99.9, cnt.pct)) });
      }
    } else html = fillN(tx.res.custom, { n: fmt(cnt.n), name: momentName(m) });
    dom.momentResult.innerHTML = html;
  }

  function renderGoals(c) {
    var tx = t();
    dom.goalList.replaceChildren();
    if (!state.items.length) {
      var li0 = document.createElement("li");
      li0.className = "empty";
      li0.style.gridTemplateColumns = "1fr";
      li0.innerHTML = '<span class="m">' + esc(tx.goalEmpty) + "</span>";
      dom.goalList.appendChild(li0);
      return;
    }
    state.items.slice().sort(function (a, b) { return a.age - b.age; }).forEach(function (it) {
      var li = document.createElement("li");
      if (it.done) li.className = "done";
      var left = document.createElement("div");
      var tt = document.createElement("div"); tt.className = "t"; tt.textContent = it.title;
      var mm = document.createElement("div"); mm.className = "m";
      var g = goalWeek(it.age);
      mm.textContent = it.done ? tx.goalDoneMeta : g <= c.lived ? fill(tx.goalPast, { a: it.age }) : fill(tx.goalMeta, { a: it.age, w: fmt(g - c.lived) });
      left.append(tt, mm);
      var acts = document.createElement("div"); acts.className = "acts";
      var tog = document.createElement("button");
      tog.type = "button"; tog.className = "mini" + (it.done ? "" : " on");
      tog.textContent = it.done ? tx.goalReopen : tx.goalDone;
      tog.addEventListener("click", function () { it.done = !it.done; save(); refreshGoals(); });
      var del = document.createElement("button");
      del.type = "button"; del.className = "mini"; del.textContent = tx.goalRemove;
      del.addEventListener("click", function () {
        state.items = state.items.filter(function (x) { return x.id !== it.id; }); save(); refreshGoals();
      });
      acts.append(tog, del);
      li.append(left, acts);
      dom.goalList.appendChild(li);
    });
  }

  function refreshGoals() {
    var c = current();
    renderGoals(c);
    renderVizHead();
    setTargets(true);
  }

  function renderCard() {
    var has = !!state.birth;
    dom.cardNeed.hidden = has;
    dom.cardBtn.disabled = !has;
    if (!has) { dom.cardImg.hidden = true; dom.cardHint.hidden = true; dom.cardDl.hidden = true; }
  }

  function renderReference() {
    var tx = t();
    dom.methodList.replaceChildren();
    tx.method.forEach(function (pair) {
      var d = document.createElement("div");
      var dt = document.createElement("dt"); dt.textContent = pair[0];
      var dd = document.createElement("dd"); dd.textContent = pair[1];
      d.append(dt, dd);
      dom.methodList.appendChild(d);
    });
    dom.sourceList.replaceChildren();
    tx.sources.forEach(function (s) {
      var li = document.createElement("li");
      var st = document.createElement("span"); st.className = "st"; st.textContent = s[0];
      var sd = document.createElement("span"); sd.className = "sd"; sd.textContent = s[1];
      li.append(st, sd);
      if (s[2]) {
        var a = document.createElement("a");
        a.href = s[2]; a.target = "_blank"; a.rel = "noopener"; a.textContent = s[2].replace(/^https?:\/\//, "");
        li.appendChild(a);
      }
      dom.sourceList.appendChild(li);
    });
    dom.faqList.replaceChildren();
    tx.faq.forEach(function (pair) {
      var d = document.createElement("details");
      var s = document.createElement("summary"); s.textContent = pair[0];
      var p = document.createElement("p"); p.textContent = pair[1];
      d.append(s, p);
      dom.faqList.appendChild(d);
    });
  }

  function applyStatic() {
    var tx = t();
    document.documentElement.lang = state.lang;
    document.title = tx.brand;
    var els = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < els.length; i++) {
      var key = els[i].getAttribute("data-i18n");
      if (typeof tx[key] === "string") els[i].textContent = tx[key];
    }
    dom.langFr.setAttribute("aria-pressed", state.lang === "fr" ? "true" : "false");
    dom.langEn.setAttribute("aria-pressed", state.lang === "en" ? "true" : "false");
    dom.lifeRange.setAttribute("aria-label", tx.lblLife);
  }

  function renderAll(snap) {
    var c = current();
    ui.week = c.lived;
    applyStatic();
    renderHero(c);
    renderScenes(c);
    renderTimes(c);
    renderGoals(c);
    renderCard();
    renderReference();
    renderVizHead();
    setTargets(snap);
  }

  function renderLive(snap) {
    var c = current();
    ui.week = c.lived;
    renderHero(c);
    renderScenes(c);
    renderTimes(c);
    renderGoals(c);
    renderCard();
    renderVizHead();
    setTargets(snap);
  }

  // ---------- Share card ----------
  function wrapLines(ctx, text, maxW, maxLines) {
    var words = String(text).split(/\s+/), lines = [], line = "";
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + " " + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    if (lines.length > maxLines) { lines = lines.slice(0, maxLines); lines[maxLines - 1] = lines[maxLines - 1].replace(/\s*\S*$/, "") + "…"; }
    return lines;
  }

  function makeCard() {
    var tx = t(), c = current();
    var W = 1080, H = 1350, M = 80;
    var cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    var x = cv.getContext("2d");
    var C = { bg: "#f3f5f8", ink: "#0e1a2b", muted: "#576477", blank: "#e0e5ec", lived: "#b2bdcb", accent: "#ff4a1c" };
    var DISPLAY = "'Bricolage Grotesque', 'Arial Narrow', Arial, sans-serif";
    var MONO = "'DM Mono', ui-monospace, monospace";
    var BODY = "'Atkinson Hyperlegible', Arial, sans-serif";

    x.fillStyle = C.bg; x.fillRect(0, 0, W, H);
    x.textBaseline = "alphabetic";

    // Logo and kicker.
    x.fillStyle = C.accent; x.fillRect(M, 92, 22, 22);
    x.fillStyle = C.muted; x.font = "500 26px " + MONO;
    x.fillText(tx.cardKicker, M + 40, 112);

    // The number.
    if ("fontStretch" in x) x.fontStretch = "condensed";
    x.fillStyle = C.ink; x.font = "800 250px " + DISPLAY;
    x.fillText(fmt(c.left), M - 6, 360);
    if ("fontStretch" in x) x.fontStretch = "normal";
    x.font = "700 40px " + BODY;
    x.fillText(fill(tx.cardUnit, { y: fmt1(c.left / WPY) }), M, 430);

    // The grid.
    var top = 500, bottom = 1230, gridMaxW = 540;
    var p = Math.min(gridMaxW / WPY, (bottom - top) / state.lifespan);
    var cs = p * 0.76, off = (p - cs) / 2;
    var goals = openGoals(c);
    var goalSet = {};
    goals.forEach(function (g) { goalSet[goalWeek(g.age)] = true; });
    for (var i = 0; i < c.total; i++) {
      var r = Math.floor(i / WPY), w = i % WPY;
      x.fillStyle = i < c.lived ? C.lived : (i === c.lived && !c.over ? C.accent : C.ink);
      x.fillRect(M + w * p + off, top + r * p + off, cs, cs);
      if (goalSet[i]) {
        x.strokeStyle = C.accent; x.lineWidth = 2.5;
        x.strokeRect(M + w * p + off - 3, top + r * p + off - 3, cs + 6, cs + 6);
      }
    }

    // Stats column.
    var sx = M + gridMaxW + 70, sy = top + 40;
    var cnt = momentCount({ id: "summers", f: 1 }, c, state.lifespan, parentAgeFor(c));
    var stats = [[tx.cardLived, fmt(c.lived), C.ink], [tx.cardLeft, fmt(c.left), C.accent], [tx.cardSummers, "≈ " + fmt(cnt.n), C.ink]];
    var am = activeMoment();
    if (am.id !== "summers" && am.id !== "parents") {
      stats.push([momentName(am).toUpperCase(), "≈ " + fmt(momentCount(am, c, state.lifespan, parentAgeFor(c)).n), C.ink]);
    }
    stats.forEach(function (s) {
      x.fillStyle = C.muted; x.font = "500 22px " + MONO; x.fillText(s[0], sx, sy);
      if ("fontStretch" in x) x.fontStretch = "condensed";
      x.fillStyle = s[2]; x.font = "800 76px " + DISPLAY; x.fillText(s[1], sx, sy + 76);
      if ("fontStretch" in x) x.fontStretch = "normal";
      sy += 150;
    });
    if (goals.length) {
      var g0 = goals[0];
      x.fillStyle = C.muted; x.font = "500 22px " + MONO; x.fillText(tx.cardGoal, sx, sy);
      x.fillStyle = C.ink; x.font = "700 34px " + BODY;
      var lines = wrapLines(x, g0.title, W - sx - M, 3);
      lines.forEach(function (ln, k) { x.fillText(ln, sx, sy + 46 + k * 42); });
      x.fillStyle = C.accent; x.font = "700 28px " + BODY;
      x.fillText(fill(tx.cardGoalIn, { w: fmt(goalWeek(g0.age) - c.lived) }), sx, sy + 46 + lines.length * 42 + 8);
    }

    // Footer.
    x.fillStyle = C.muted; x.font = "500 24px " + MONO;
    x.fillText(tx.cardFooter, M, 1296);
    return cv.toDataURL("image/png");
  }

  // ---------- Events ----------
  function bind() {
    dom.langFr.addEventListener("click", function () { state.lang = "fr"; save(); renderAll(true); });
    dom.langEn.addEventListener("click", function () { state.lang = "en"; save(); renderAll(true); });

    dom.birth.addEventListener("input", function () {
      var val = dom.birth.value;
      dom.heroErr.textContent = "";
      if (!val) state.birth = null;
      else if (val > todayIso() || val < "1900-01-01") { dom.heroErr.textContent = t().errFuture; return; }
      else state.birth = val;
      save(); renderLive(false);
    });

    function setLife(v) {
      state.lifespan = v;
      dom.lifeRange.value = String(v);
      if (document.activeElement !== dom.lifeNum) dom.lifeNum.value = String(v);
      save();
      ui.layout = layout();
      renderLive(true);
    }
    dom.lifeRange.addEventListener("input", function () { dom.heroErr.textContent = ""; dom.lifeNum.value = dom.lifeRange.value; setLife(parseInt(dom.lifeRange.value, 10)); });
    dom.lifeNum.addEventListener("input", function () {
      var v = parseInt(dom.lifeNum.value, 10);
      if (v >= 50 && v <= 110) { dom.heroErr.textContent = ""; setLife(v); }
      else dom.heroErr.textContent = t().errRange;
    });

    dom.freq.addEventListener("input", function () {
      var m = activeMoment(), v = parseInt(dom.freq.value, 10);
      if (m.fixed || isNaN(v)) return;
      m.f = Math.max(0, Math.min(365, v));
      save(); renderTimes(current()); setTargets(false);
    });
    dom.parentAge.addEventListener("input", function () {
      var v = parseInt(dom.parentAge.value, 10);
      if (dom.parentAge.value === "") state.parentAge = null;
      else if (v >= 15 && v <= 120) state.parentAge = v;
      else return;
      save(); renderTimes(current()); setTargets(false);
    });
    dom.momentRemove.addEventListener("click", function () {
      state.moments = state.moments.filter(function (m) { return m.id !== state.active; });
      state.active = "summers";
      save(); renderTimes(current()); renderVizHead(); setTargets(false);
    });
    dom.addForm.addEventListener("submit", function (e) {
      e.preventDefault();
      var name = dom.addName.value.trim(), f = parseInt(dom.addFreq.value, 10);
      if (!name || !(f >= 1 && f <= 365)) { dom.addErr.textContent = t().addErr; return; }
      dom.addErr.textContent = "";
      var id = "c" + Date.now().toString(36);
      state.moments.push({ id: id, f: f, name: name.slice(0, 30) });
      state.active = id;
      dom.addName.value = ""; dom.addFreq.value = "";
      save(); renderTimes(current()); renderVizHead(); setTargets(false);
    });

    dom.goalForm.addEventListener("submit", function (e) {
      e.preventDefault();
      var tx = t(), c = current();
      var title = dom.goalTitle.value.trim(), age = parseInt(dom.goalAge.value, 10);
      var min = c.age + 1, max = state.lifespan;
      if (!title) { dom.goalErr.textContent = tx.errGoalTitle; dom.goalTitle.focus(); return; }
      if (!(age >= min && age <= max)) { dom.goalErr.textContent = fill(tx.errGoalAge, { min: min, max: max }); dom.goalAge.focus(); return; }
      if (state.items.length >= 8) { dom.goalErr.textContent = tx.errGoalFull; return; }
      dom.goalErr.textContent = "";
      state.items.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: title.slice(0, 60), age: age, done: false });
      dom.goalTitle.value = ""; dom.goalAge.value = "";
      save(); refreshGoals();
    });

    dom.cardBtn.addEventListener("click", function () {
      if (!state.birth) return;
      var url;
      try { url = makeCard(); } catch (err) { return; }
      dom.cardImg.src = url;
      dom.cardImg.alt = t().cardKicker + " : " + fmt(current().left);
      dom.cardImg.hidden = false;
      dom.cardHint.hidden = false;
      dom.cardDl.href = url;
      dom.cardDl.download = state.lang === "fr" ? "combien-de-semaines.png" : "how-many-weeks.png";
      dom.cardDl.hidden = false;
    });

    dom.clearBtn.addEventListener("click", function () {
      try { localStorage.removeItem(KEY); OLD_KEYS.forEach(function (k) { localStorage.removeItem(k); }); } catch (e) { /* nothing stored */ }
      var lang = state.lang;
      state = { lang: lang, birth: null, lifespan: 80, moments: cloneMoments(DEFAULT_MOMENTS), active: "summers", parentAge: null, items: [] };
      dom.birth.value = ""; dom.lifeRange.value = "80"; dom.lifeNum.value = "80";
      dom.cardImg.hidden = true; dom.cardHint.hidden = true; dom.cardDl.hidden = true;
      save();
      ui.layout = layout();
      renderAll(true);
      dom.clearStatus.textContent = t().cleared;
    });

    // Grid: hover with a mouse, tap on touch screens.
    dom.cv.addEventListener("pointermove", function (e) {
      ui.lastPointer = e.pointerType;
      if (e.pointerType !== "mouse") return;
      var p = pointerPos(e), i = cellAt(p.x, p.y);
      if (i === null) hideTip(); else if (i !== ui.hover) showTip(i, p.x, p.y);
    });
    dom.cv.addEventListener("pointerdown", function (e) { ui.lastPointer = e.pointerType; });
    dom.cv.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") hideTip(); });
    dom.cv.addEventListener("click", function (e) {
      if (ui.lastPointer === "mouse") return;
      var p = pointerPos(e), i = cellAt(p.x, p.y);
      if (i === null || i === ui.hover) hideTip(); else showTip(i, p.x, p.y);
    });

    window.addEventListener("scroll", function () {
      if (ui.ticking) return;
      ui.ticking = true;
      requestAnimationFrame(function () { ui.ticking = false; pickScene(); });
    }, { passive: true });

    if (window.ResizeObserver) new ResizeObserver(function () { resize(); draw(); }).observe(dom.stage);
    window.addEventListener("resize", function () { pickScene(); });

    // Follow the viewer's theme, whether set by the system or by the host.
    function themeChanged() { ui.colors = readColors(); setTargets(true); }
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      if (mq.addEventListener) mq.addEventListener("change", themeChanged);
    }
    new MutationObserver(themeChanged).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  }

  function init() {
    dom = {
      stage: $("stage"), cv: $("cv"), tip: $("tip"), legend: $("legend"),
      vizStep: $("viz-step"), vizTitle: $("viz-title"), vizExample: $("viz-example"),
      langFr: $("lang-fr"), langEn: $("lang-en"),
      birth: $("birth"), lifeRange: $("life-range"), lifeNum: $("life-num"), heroErr: $("hero-err"),
      exampleNote: $("example-note"), heroBig: $("hero-big"), heroUnit: $("hero-unit"), heroSub: $("hero-sub"),
      chips: $("chips"), freqRow: $("freq-row"), freqLbl: $("freq-lbl"), freq: $("freq"),
      parentRow: $("parent-row"), parentAge: $("parent-age"), parentHint: $("parent-hint"),
      momentResult: $("moment-result"), momentRemove: $("moment-remove"),
      addForm: $("add-form"), addName: $("add-name"), addFreq: $("add-freq"), addErr: $("add-err"),
      goalForm: $("goal-form"), goalTitle: $("goal-title"), goalAge: $("goal-age"), goalErr: $("goal-err"), goalList: $("goal-list"),
      cardBig: $("card-big"), cardBtn: $("card-btn"), cardDl: $("card-dl"), cardImg: $("card-img"), cardHint: $("card-hint"), cardNeed: $("card-need"),
      methodList: $("method-list"), sourceList: $("source-list"), faqList: $("faq-list"),
      clearBtn: $("clear-btn"), clearStatus: $("clear-status"),
      scenes: Array.prototype.slice.call(document.querySelectorAll(".scene")),
      kicks: Array.prototype.slice.call(document.querySelectorAll("[data-kick]"))
    };
    dom.ctx = dom.cv.getContext("2d");
    dom.dpr = 1;

    load();
    dom.birth.max = todayIso();
    if (state.birth) dom.birth.value = state.birth;
    dom.lifeRange.value = String(state.lifespan);
    dom.lifeNum.value = String(state.lifespan);

    ui.colors = readColors();
    resize();
    bind();

    // First frame: an empty grid that fills in with this life.
    ui.scene = "you";
    var c = current();
    ui.cur = new Float32Array(c.total * 3);
    var blank = ui.colors.roles[R.BLANK];
    for (var i = 0; i < c.total; i++) { ui.cur[i * 3] = blank[0]; ui.cur[i * 3 + 1] = blank[1]; ui.cur[i * 3 + 2] = blank[2]; }
    renderAll(false);
    pickScene();

    // Keeps "this week" right if a week rolls over while the page stays open.
    setInterval(function () { if (current().lived !== ui.week) renderLive(true); }, 60000);
    // Redraw once the web fonts arrive, so grid labels use them.
    fontsReady.then(function () { if (ui.layout) draw(); });
  }

  var fontsReady = document.fonts && document.fonts.load
    ? Promise.all([
        document.fonts.load("800 60px 'Bricolage Grotesque'"),
        document.fonts.load("400 16px 'Atkinson Hyperlegible'"),
        document.fonts.load("500 11px 'DM Mono'")
      ]).catch(function () {})
    : Promise.resolve();
  var timeout = new Promise(function (res) { setTimeout(res, 1500); });
  Promise.race([fontsReady, timeout]).then(init);
})();
</script>

</body></html>
