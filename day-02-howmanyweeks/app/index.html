<style>
/* Layout: a scroll story. A sticky life grid (left on desktop, top on phone) re-colours itself as ten personal scenes scroll past; reference sections follow. */
:root {
  --bg: #fcfcfe;
  --paper: #ffffff;
  --ink: #1c2240;
  --muted: #4a5070;
  --line: #d9d2ec;
  --sey: #cfc4e6;
  --field: #7a74a0;
  --sey-2: #ece7f6;
  --margin-red: #e5536b;
  --blue: #2350b8;
  --blue-dark: #1b3f94;
  --blue-soft: #e8edfa;
  --c-blank: #c9cddc;
  --c-lived: #2350b8;
  --c-left: #e4def2;
  --accent: #d0273c;
  --accent-ink: #ffffff;
  --err: #c0233a;
  --f-display: "Playwrite FR Trad", "Segoe Script", cursive;
  --f-body: "Andika", "Atkinson Hyperlegible", system-ui, sans-serif;
  --f-mono: "Andika", system-ui, sans-serif;
  --bar-h: 56px;
  --sq: 32px;
  --mx: max(10px, calc(50% - 640px));
  --ch0: #6ccff6; --ch1: #ffe45c; --ch2: #7fe07a; --ch3: #b98cff;
  --lg0: #ff8cc6; --lg1: #ffe45c; --lg2: #6ccff6; --lg3: #b98cff; --lg4: #7fe07a; --lg5: #ffae4d; --lg6: #c3c7d4;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(to right, var(--sey) 1px, transparent 1px),
    linear-gradient(to bottom, var(--sey) 1px, transparent 1px),
    linear-gradient(to bottom, var(--sey-2) 1px, transparent 1px);
  background-size: var(--sq) var(--sq), var(--sq) var(--sq), var(--sq) calc(var(--sq) / 4);
  caret-color: var(--blue);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 40; background: var(--bg);
}
body::after { content: ""; position: fixed; top: 0; bottom: 0; left: var(--mx); width: 2px; background: var(--margin-red); z-index: 0; pointer-events: none; }
html, body { overflow-x: clip; }
html { scrollbar-color: var(--sey) var(--bg); }
::selection { background: var(--lg1); color: var(--ink); }
p, .hint, .body, .lead { text-wrap: pretty; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 2px; }

.gutter {
  padding-left: max(30px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--paper); border-bottom: 1px solid var(--line);
}
.bar-in { max-width: 1240px; margin: 0 auto; height: var(--bar-h); display: flex; align-items: center; gap: 12px; }
.brand {
  display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink);
  font-family: var(--f-body); font-weight: 700; font-size: 18px; white-space: nowrap;
}
.logo { width: 16px; height: 16px; flex: none; }
.logo rect { fill: var(--ink); }
.logo .lv { fill: var(--c-lived); }
.logo .nw { fill: var(--accent); }
.day { font-size: 13px; color: var(--muted); white-space: nowrap; }
.nav { display: none; gap: 2px; margin-left: auto; }
.nav a { font-size: 14px; color: var(--muted); text-decoration: none; padding: 8px 10px; border-radius: 4px; }
.nav a:hover { color: var(--ink); background: var(--blue-soft); }
.seg { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 4px; padding: 2px; flex: none; background: var(--paper); }
.seg button {
  font: inherit; font-size: 13px; min-height: 32px; min-width: 40px; padding: 0 10px;
  border: 0; border-radius: 3px; background: transparent; color: var(--muted); cursor: pointer;
}
.seg button[aria-pressed="true"] { color: var(--blue); font-weight: 700; box-shadow: inset 0 -2px 0 var(--blue); }
@media (min-width: 900px) {
  .nav { display: flex; }
  .seg { margin-left: 8px; }
}
@media (max-width: 560px) { .day { display: none; } }
.brand { min-width: 0; }
.brand span { overflow: hidden; text-overflow: ellipsis; }

/* ---------- Story ---------- */
.story { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; }
.viz-col {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h)); z-index: 10;
  height: 48vh; height: 48svh;
  background: var(--paper); border-bottom: 1px solid var(--line);
  padding-block: 10px 14px;
}
.viz { height: 100%; display: flex; flex-direction: column; gap: 6px; }
.viz-head { display: flex; align-items: center; gap: 10px; min-height: 24px; font-size: 14px; color: var(--muted); }
.step { font-variant-numeric: tabular-nums; }
.viz-title { color: var(--ink); font-weight: 700; }
.pill {
  font-size: 12px; line-height: 1; padding: 5px 8px; border-radius: 3px;
  background: var(--accent); color: var(--accent-ink);
}
.stage { position: relative; flex: 1; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-y; cursor: crosshair; }
.tip {
  position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; max-width: 230px;
  background: var(--ink); color: var(--paper); padding: 8px 10px; border-radius: 4px;
  font-size: 12px; line-height: 1.4;
}
.tip b { display: block; font-size: 13px; }
.tip .hl { color: #ff9aa8; font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; min-height: 18px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.sw.blank { background: var(--c-blank); }
.sw.lived { background: var(--c-lived); }
.sw.left { background: var(--c-left); }
.sw.accent { background: var(--accent); }
.sw.now { background: var(--accent); box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 3px var(--ink); }
.sw.ring { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
.sw.ch0 { background: var(--ch0); } .sw.ch1 { background: var(--ch1); } .sw.ch2 { background: var(--ch2); } .sw.ch3 { background: var(--ch3); }
.sw.line { background: var(--ink); height: 2px; border-radius: 0; }
.sw.lg0 { background: var(--lg0); } .sw.lg1 { background: var(--lg1); } .sw.lg2 { background: var(--lg2); } .sw.lg3 { background: var(--lg3); } .sw.lg4 { background: var(--lg4); } .sw.lg5 { background: var(--lg5); } .sw.lg6 { background: var(--lg6); }
.ritual { margin-top: 22px; }
.ritual h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; line-height: 1.6; color: var(--blue); }
.ritual .wk { margin: 0; font-size: 14px; color: var(--muted); }
.cat { --c: var(--line); }
.cat::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
.tally { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.tally span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; background: var(--c); }

.scenes { position: relative; z-index: 1; }
.scene {
  min-height: 72vh; min-height: 72svh;
  padding-block: 28px 48px;
  scroll-margin-top: calc(var(--bar-h) + 48vh);
}
.kick { display: none; }
.say {
  margin: 0; font-family: var(--f-display); font-weight: 400; color: var(--blue);
  font-size: clamp(25px, 5.2vw, 38px); line-height: 1.6; text-wrap: balance; padding-bottom: 10px;
}
.say .n { color: var(--accent); font-variant-numeric: tabular-nums; }
.say s { text-decoration-thickness: 2px; text-decoration-color: var(--accent); color: var(--muted); }
.body { margin: 14px 0 0; max-width: 46ch; font-size: 18px; line-height: 1.6; color: var(--ink); }
.body .n { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

/* Hero scene */
.scene-you { min-height: 0; padding-top: 22px; }
.h1 {
  margin: 8px 0 30px; font-family: var(--f-display); font-weight: 400; color: var(--blue);
  font-size: clamp(28px, 5.4vw, 42px); line-height: 1.75; text-wrap: balance;
  text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 0.22em; text-decoration-skip-ink: none;
}
.lead { margin: 10px 0 0; max-width: 46ch; color: var(--ink); font-size: 18px; line-height: 1.6; }
.panel {
  margin-top: 22px; padding: 16px; display: grid; gap: 14px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 4px;
}
.form { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 520px) { .form { grid-template-columns: 1fr 1fr; } }
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.label { font-size: 14px; color: var(--muted); }
input[type="date"], input[type="number"], input[type="text"] {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--paper);
  border: 1px solid var(--field); border-radius: 4px; min-height: 46px; padding: 0 12px;
  width: 100%; min-width: 0;
}
input[type="range"] { width: 100%; accent-color: var(--blue); margin: 0; }
.life { display: grid; grid-template-columns: 1fr 84px; gap: 10px; align-items: center; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.err { margin: 0; font-size: 14px; font-weight: 700; color: var(--err); }
.err:empty { display: none; }
.note { margin: 16px 0 0; padding: 10px 12px; font-size: 15px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); }
.answer { margin-top: 26px; }
.big {
  margin: 0; font-family: var(--f-display); font-weight: 400; color: var(--accent);
  font-size: clamp(44px, 10vw, 72px); line-height: 1.45; font-variant-numeric: tabular-nums;
}
.unit { margin: 0; font-weight: 700; font-size: 20px; }
.sub { margin: 4px 0 0; color: var(--muted); }
.start {
  display: inline-flex; align-items: center; min-height: 46px; margin-top: 22px; padding: 0 20px;
  border-radius: 4px; background: var(--blue); color: #fff; font-weight: 700; text-decoration: none;
}
.start:hover, .btn:not(.ghost):hover { background: var(--blue-dark); }
.privacy-line { margin: 12px 0 0; font-size: 13px; color: var(--muted); }

/* Tools inside scenes */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: 15px; min-height: 42px; padding: 0 14px; border-radius: 4px;
  border: 1px solid var(--sey); background: var(--paper); color: var(--ink); cursor: pointer;
}
.chip:hover { border-color: var(--blue); }
.chip[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 12px; align-items: center; }
.result { margin: 0; font-size: 17px; }
.result .n { font-weight: 700; font-size: 1.2em; color: var(--accent); font-variant-numeric: tabular-nums; }
.btn {
  font: inherit; font-size: 15px; font-weight: 700; min-height: 46px; padding: 0 18px;
  border: 0; border-radius: 4px; background: var(--blue); color: #fff; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
}
.btn.ghost { background: var(--paper); color: var(--blue); border: 1px solid var(--blue); }
.btn.ghost:hover { background: var(--blue-soft); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.mini {
  font: inherit; font-size: 14px; min-height: 36px; padding: 0 12px; border-radius: 4px;
  border: 1px solid var(--sey); background: var(--paper); color: var(--ink); cursor: pointer;
}
.mini.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.add summary { cursor: pointer; font-weight: 700; min-height: 36px; display: flex; align-items: center; }
.add-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px auto; gap: 8px; align-items: end; margin-top: 10px; }
@media (max-width: 460px) { .add-row { grid-template-columns: minmax(0, 1fr) 84px; } .add-row .btn { grid-column: 1 / -1; } }
.goals { list-style: none; margin: 0; padding: 0; }
.goals li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.goals .t { font-weight: 700; overflow-wrap: anywhere; }
.goals .m { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.goals .done .t { text-decoration: line-through; color: var(--muted); }
.goals .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.quote { margin: 0 0 22px; }
.quote p { margin: 0; font-family: var(--f-display); font-weight: 400; color: var(--blue); font-size: clamp(19px, 3.6vw, 24px); line-height: 1.7; text-wrap: balance; }
.quote footer { margin-top: 8px; font-size: 14px; color: var(--muted); }
.card-img { display: block; width: 100%; max-width: 360px; height: auto; border-radius: 4px; border: 1px solid var(--line); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

@media (min-width: 900px) {
  .story { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: 56px; align-items: start; }
  .viz-col { height: calc(100vh - var(--bar-h)); height: calc(100svh - var(--bar-h) - env(safe-area-inset-top, 0px)); border-bottom: 0; padding-block: 22px 18px; }
  .scene { min-height: 88vh; min-height: 88svh; display: flex; flex-direction: column; justify-content: center; scroll-margin-top: var(--bar-h); }
  .scene-you { min-height: calc(100svh - var(--bar-h)); }
}

/* ---------- Reference sections ---------- */
.page { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; }
.sec {
  padding-block: 56px; border-top: 1px solid var(--line); display: grid; gap: 18px;
  scroll-margin-top: calc(var(--bar-h) + 12px);
}
@media (min-width: 900px) { .sec { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 48px; } }
.sec h2 {
  margin: 0; font-family: var(--f-display); font-weight: 400; color: var(--blue);
  font-size: clamp(26px, 4vw, 36px); line-height: 1.7; align-self: start;
  text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 0.22em; text-decoration-skip-ink: none;
}
.sec .content { min-width: 0; max-width: 64ch; }
.sec .content > p { margin: 0 0 14px; }
.defs { margin: 0; display: grid; gap: 0; }
.defs div { padding: 14px 0; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.defs dt { font-weight: 700; }
.defs dd { margin: 0; color: var(--muted); text-wrap: pretty; }
.srcs { list-style: none; margin: 0; padding: 0; }
.srcs li { padding: 14px 0; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.srcs .st { font-weight: 700; }
.srcs .sd { color: var(--muted); }
.srcs a { font-size: 14px; overflow-wrap: anywhere; }
.faq details { border-top: 1px solid var(--line); padding: 12px 0; }
.faq summary { cursor: pointer; font-weight: 700; min-height: 32px; display: flex; align-items: center; }
.faq details p { margin: 8px 0 0; color: var(--muted); }
.status { font-size: 14px; color: var(--muted); margin: 10px 0 0; }

.foot { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding-block: 28px calc(28px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--muted); }
.foot a { color: var(--ink); }
.foot nav { display: flex; flex-wrap: wrap; gap: 8px 14px; }

/* ---------- v2 additions ---------- */
.lives { display: grid; gap: 10px; }
.lives .grp { display: grid; gap: 6px; }
.lives .gl { font-size: 14px; color: var(--muted); }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 15px; }
.tl .ag { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.tl .b { color: var(--muted); font-weight: 400; }
.srcl { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.chip.dot::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
.chbar { position: relative; z-index: 31; background: var(--ink); color: #f4f5fb; font-size: 13px; line-height: 1.4; padding-block: 7px; }
.chbar .in { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: center; justify-content: space-between; }
@media (max-width: 560px) { .chtag { display: none; } }
.chbar a { color: #ffe45c; font-weight: 700; text-decoration: none; }
.prog { position: absolute; left: 0; bottom: -1px; height: 3px; width: 0; background: var(--accent); }
.skip { display: inline-block; margin: 22px 0 0 14px; font-weight: 700; color: var(--ink); }
.note.cta { font-size: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.dob { display: grid; grid-template-columns: 72px minmax(0, 1fr) 96px; gap: 8px; }
.form > .field:has(.dob) { grid-column: 1 / -1; }
select { font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1px solid var(--field); border-radius: 4px; min-height: 46px; padding: 0 10px; width: 100%; min-width: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.out { margin: 0; font-size: 16px; }
.out .n { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.out + .out { margin-top: 8px; }
.add-row.wide { grid-template-columns: minmax(0, 1fr) 160px auto; }
@media (max-width: 460px) { .add-row.wide { grid-template-columns: minmax(0, 1fr); } }
.fam { display: grid; gap: 8px; }
.fam .r { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 13px; }
.fam .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fam .track { position: relative; height: 14px; background: var(--c-blank); border-radius: 4px; overflow: hidden; }
.fam .seg { position: absolute; top: 0; bottom: 0; background: var(--c-lived); }
.fam .seg.you { background: var(--c-left); }
.fam .ov { position: absolute; top: 0; bottom: 0; background: var(--accent); }
.fam .nowl { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; min-height: 36px; }
.check input { width: 18px; height: 18px; accent-color: var(--blue); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.stage canvas:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.goals .sh { color: var(--accent); font-weight: 700; }
/* Open Doodles by Pablo Stanley (CC0), recoloured in the notebook inks */
.dd { margin: 14px 0 4px; width: 100%; max-width: 230px; }
.dd svg { display: block; width: 100%; height: auto; }
.dd .i { fill: var(--blue); }
.dd .a { fill: var(--lg1); }
@media (max-width: 899px) { .dd { max-width: 170px; } }
@media (max-width: 899px) { .scene { min-height: 58vh; min-height: 58svh; } }

      method: [
        ["Weeks lived", "Days between your date of birth and today, divided by 7, rounded down. It counts calendar days, so clock changes never shift a week."],
        ["The grid", "One row per year, 52 boxes per row. Total = lifespan × 52. A real year is 52.18 weeks: over 80 years, the grid leaves out about 14 weeks."],
        ["Sundays and summers", "One box is one week, so one Sunday. Summers counted the same way as in “The times”."],
        ["The rows", "The first 3 rows are marked forgotten: the earliest memory comes at about three and a half on average. The work block runs from 22 to 65 by default, adjustable in “Your people”, Work tab. Adult life starts at 18."],
        ["How it feels", "One year is worth 1 ÷ your age of the life you have lived. This is the proportional law Paul Janet proposed in 1877."],
        ["The times", "Years left × times per year. For your parents, the horizon ends at the shorter of your life or theirs, with the same lifespan. The share already spent assumes you lived with them every day until 18, as in Tim Urban's calculation."],
        ["Sunday check-in", "Each logged week colours its box on your grid with the colour of the category you picked. The reminder is a weekly calendar event you add yourself. Moment reminders follow your frequency: 52 a year becomes weekly, 24 every two weeks, 12 monthly."],
        ["Other lives", "Dates checked one by one against the sources listed under each life. When only the year is known, the moment sits mid-year. Ages are counted in weeks from birth. Typical French life: INSEE, DREES and UN averages, not a real person."],
        ["Your goals", "Each goal lights up the last week before the age you chose."],
        ["Country and sex", "Life expectancy at birth, United Nations World Population Prospects 2024, 2023 estimates, rounded to the year. It is an average: for someone already 35, the real figure is a little higher."],
        ["Your people", "Weeks since a date = days ÷ 7. Couple: the crossing date is the day time together equals the time lived before. Children: weeks until they turn 18, multiplied by your custody share. Summers (mid-July) are not halved: with shared custody, each parent often gets a few weeks every summer, which you set yourself. Family bars assume the same lifespan for everyone."],
        ["Work", "Working days a year = days a week × 52, minus public holidays and days off. Meetings and commute are turned into full 24-hour weeks. Waking hours count 16 a day."]
      ],

    dom.summerWeeks.addEventListener("input", function () { var v = dom.summerWeeks.value === "" ? 0 : parseInt(dom.summerWeeks.value, 10); if (!(v >= 0 && v <= 12)) return; state.summerWeeks = v; circlesChanged(); });
    dom.custody.addEventListener("input", function () { var v = parseFloat(dom.custody.value); if (!(v >= 0 && v <= 100)) return; state.custody = v; circlesChanged(); });
    dom.cpSince.addEventListener("change", function () { var v = dom.cpSince.value; state.since = validIso(v) && v <= todayIso() ? v : ""; circlesChanged(); });
    dom.cpBirth.addEventListener("change", function () { var v = dom.cpBirth.value; state.partnerBirth = validIso(v) && v <= todayIso() ? v : ""; circlesChanged(); });
    dom.cpIcs.addEventListener("click", function () {

      function onYear(yy) { var iso = yy + "-" + p2(p.m) + "-" + p2(p.d); return validIso(iso) ? iso : yy + "-" + p2(p.m) + "-28"; }
      var next = onYear(y);
      if (next < todayIso()) next = onYear(y + 1);

    });
    dom.workInputs.forEach(function (inp) {
      inp.addEventListener("input", function () {
        var k = inp.getAttribute("data-w"), v = parseFloat(inp.value);
        if (!isFinite(v) || v < WORK_LIMITS[k][0] || v > WORK_LIMITS[k][1]) return;
        state[k] = k === "screenH" || k === "projY" ? v : Math.round(v);

        save(); renderScenes(current()); renderCircles(current()); renderVizHead(); setTargets(false);

    });
    dom.goalExample.addEventListener("click", function () {

    dom.remindBtn.addEventListener("click", function () {

      downloadBlob(new Blob([JSON.stringify(payload(), null, 2)], { type: "application/json" }), "how-many-weeks-data.json");

    });
    dom.importFile.addEventListener("change", function () {
      var f = dom.importFile.files && dom.importFile.files[0]; if (!f) return;

        var ok = false;
        try { ok = applySaved(JSON.parse(String(rd.result))); } catch (e) { ok = false; }

        if (!ok) { dom.ioStatus.textContent = t().importErr; return; }

        dom.ioStatus.textContent = t().imported;
      };
      rd.readAsText(f);

    dom.cv.addEventListener("keydown", function (e) {
      var c = current(), k = e.key, i = ui.kbd === null ? Math.min(c.lived, c.total - 1) : ui.kbd;
      if (k === "Escape") { ui.kbd = null; hideTip(); return; }
      if (k === "ArrowRight") i += 1; else if (k === "ArrowLeft") i -= 1; else if (k === "ArrowDown") i += WPY; else if (k === "ArrowUp") i -= WPY;
      else if (k === "Home") i = 0; else if (k === "End") i = c.total - 1; else if (k !== "Enter" && k !== " ") return;
      e.preventDefault();
      i = Math.max(0, Math.min(c.total - 1, i));
      ui.kbd = i;
      var q = cellXY(i);
      showTip(i, q.x, q.y);
    });
    dom.cv.addEventListener("blur", function () { ui.kbd = null; hideTip(); });
    dom.goalForm.addEventListener("submit", function (e) {
      e.preventDefault();
      var tx = t(), c = current();
      var title = dom.goalTitle.value.trim(), age = parseInt(dom.goalAge.value, 10);

    });

    dom.cardBtn.addEventListener("click", function () { buildCard(); dom.cardStatus.textContent = ""; });

    dom.clearBtn.addEventListener("click", function () {
      try { localStorage.removeItem(KEY); OLD_KEYS.forEach(function (k) { localStorage.removeItem(k); }); } catch (e) { /* nothing stored */ }
      var lang = state.lang;
      state = freshState(lang);
      setDobFields(null); dom.lifeRange.value = "80"; dom.lifeNum.value = "80";
      dom.cardImg.hidden = true; dom.cardHint.hidden = true; dom.cardDl.hidden = true; dom.cardShare.hidden = true; ui.cardCv = null;
      save();
      ui.layout = layout();
      renderAll(true);
      dom.clearStatus.textContent = t().cleared;
    });

    // Grid: hover with a mouse, tap on touch screens.
    dom.cv.addEventListener("pointermove", function (e) {
      ui.lastPointer = e.pointerType;
      if (e.pointerType !== "mouse") return;
      var p = pointerPos(e), i = cellAt(p.x, p.y);
      if (i === null) hideTip(); else if (i !== ui.hover) showTip(i, p.x, p.y);
    });
    dom.cv.addEventListener("pointerdown", function (e) { ui.lastPointer = e.pointerType; });
    dom.cv.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") hideTip(); });
    dom.cv.addEventListener("click", function (e) {
      if (ui.lastPointer === "mouse") return;
      var p = pointerPos(e), i = cellAt(p.x, p.y);
      if (i === null || i === ui.hover) hideTip(); else showTip(i, p.x, p.y);
    });

    window.addEventListener("scroll", function () {
      if (ui.ticking) return;
      ui.ticking = true;
      requestAnimationFrame(function () { ui.ticking = false; pickScene(); updateProgress(); });
    }, { passive: true });

    if (window.ResizeObserver) new ResizeObserver(function () { resize(); draw(); }).observe(dom.stage);
    window.addEventListener("resize", function () { pickScene(); });

    // Follow the viewer's theme, whether set by the system or by the host.
    function themeChanged() { ui.colors = readColors(); setTargets(true); }
    if (window.matchMedia) {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      if (mq.addEventListener) mq.addEventListener("change", themeChanged);
    }
    new MutationObserver(themeChanged).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  }

  function init() {
    dom = {
      stage: $("stage"), cv: $("cv"), tip: $("tip"), legend: $("legend"),
      vizStep: $("viz-step"), vizTitle: $("viz-title"), vizExample: $("viz-example"),
      langFr: $("lang-fr"), langEn: $("lang-en"),
      dobD: $("dob-d"), dobM: $("dob-m"), dobY: $("dob-y"), country: $("country"), sex: $("sex"), exampleGo: $("example-go"), prog: $("prog"),
      grandRow: $("grand-row"), grandAge: $("grand-age"), grandHint: $("grand-hint"), momentPlus: $("moment-plus"),
      ritual: $("ritual"), ritWeek: $("rit-week"), ritWhich: $("rit-which"), ritQ: $("rit-q"), ritCats: $("rit-cats"), ritNote: $("rit-note"), ritNext: $("rit-next"), ritStatus: $("rit-status"), ritTally: $("rit-tally"), ritIcs: $("rit-ics"), ritGcal: $("rit-gcal"), ritBackup: $("rit-backup"), ritExport: $("rit-export"), momentGcal: $("moment-gcal"), momentRestore: $("moment-restore"),
      momentIcs: $("moment-ics"), momentIcsStatus: $("moment-ics-status"),
      chapForm: $("chap-form"), chapLabel: $("chap-label"), chapFrom: $("chap-from"), chapTo: $("chap-to"), chapErr: $("chap-err"), chapList: $("chap-list"),
      lives: $("lives"), olOut: $("ol-out"), olTl: $("ol-tl"), olSrc: $("ol-src"),
      evForm: $("ev-form"), evLabel: $("ev-label"), evDate: $("ev-date"), evErr: $("ev-err"), evList: $("ev-list"),
      tabs: $("tabs"), frName: $("fr-name"), frMet: $("fr-met"), frOut: $("fr-out"),
      kidForm: $("kid-form"), kidName: $("kid-name"), kidBirth: $("kid-birth"), kidErr: $("kid-err"), kidList: $("kid-list"), fam: $("fam"), famHint: $("fam-hint"),
      custody: $("custody"), summerWeeks: $("summer-weeks"), cpSince: $("cp-since"), cpBirth: $("cp-birth"), cpOut: $("cp-out"), cpIcs: $("cp-ics"),
      workInputs: Array.prototype.slice.call(document.querySelectorAll("[data-w]")), wOut: $("w-out"),
      goalShared: $("goal-shared"), goalExample: $("goal-example"),
      cardThemes: $("card-themes"), cardFmts: $("card-fmts"), cardShare: $("card-share"), remindBtn: $("remind-btn"), cardStatus: $("card-status"),
      posterSizes: $("poster-sizes"), posterShade: $("poster-shade"), posterBtn: $("poster-btn"), posterStatus: $("poster-status"),
      exportBtn: $("export-btn"), importFile: $("import-file"), ioStatus: $("io-status"),
      lifeRange: $("life-range"), lifeNum: $("life-num"), heroErr: $("hero-err"),
      exampleNote: $("example-note"), heroBig: $("hero-big"), heroUnit: $("hero-unit"), heroSub: $("hero-sub"),
      chips: $("chips"), freqRow: $("freq-row"), freqLbl: $("freq-lbl"), freq: $("freq"),
      parentRow: $("parent-row"), parentAge: $("parent-age"), parentHint: $("parent-hint"),
      momentResult: $("moment-result"), momentRemove: $("moment-remove"),
      addForm: $("add-form"), addName: $("add-name"), addFreq: $("add-freq"), addErr: $("add-err"),
      goalForm: $("goal-form"), goalTitle: $("goal-title"), goalAge: $("goal-age"), goalErr: $("goal-err"), goalList: $("goal-list"),
      cardBig: $("card-big"), cardBtn: $("card-btn"), cardDl: $("card-dl"), cardImg: $("card-img"), cardHint: $("card-hint"), cardNeed: $("card-need"),
      methodList: $("method-list"), sourceList: $("source-list"), faqList: $("faq-list"),
      clearBtn: $("clear-btn"), clearStatus: $("clear-status"),
      scenes: Array.prototype.slice.call(document.querySelectorAll(".scene")),
      kicks: Array.prototype.slice.call(document.querySelectorAll("[data-kick]"))
    };
    dom.ctx = dom.cv.getContext("2d");

    ui.colors = readColors();
    resize();
    bind();

    var blank = ui.colors.roles[R.BLANK];

    // Keeps "this week" right if a week rolls over while the page stays open.
    setInterval(function () { if (current().lived !== ui.week) renderLive(true); }, 60000);

    fontsReady.then(function () { if (ui.layout) draw(); });
  }

  var fontsReady = document.fonts && document.fonts.load
    ? Promise.all([
        document.fonts.load("400 60px 'Playwrite FR Trad'"),
        document.fonts.load("400 16px Andika"),
        document.fonts.load("700 16px Andika")

    : Promise.resolve();
  var timeout = new Promise(function (res) { setTimeout(res, 1500); });
  Promise.race([fontsReady, timeout]).then(init);
})();
