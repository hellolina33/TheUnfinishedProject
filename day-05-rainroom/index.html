  --night:#0B0F1A; --glass:rgba(16,23,41,.74); --line:rgba(237,231,219,.13);

  --f:"Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--night);color:var(--text);font:16px/1.5 var(--f);min-height:100dvh;overflow-x:clip}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px;border-radius:8px}
[hidden]{display:none!important}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left))}
.chal{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:14px 0}
.chal a{color:var(--lamp);font-weight:600;text-decoration:none}
.seg{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:none;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;min-height:28px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--night)}

.top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:end;padding:5vh 0 26px}
h1{font-size:clamp(52px,9vw,112px);line-height:.9;letter-spacing:-.04em;font-weight:800}
h1 em{font-style:normal;color:var(--lamp)}
.lead{margin-top:16px;color:var(--muted);font-size:18px;max-width:42ch;text-wrap:pretty}
.player{display:flex;align-items:center;gap:20px;justify-self:end}
.play{position:relative;width:132px;height:132px;border-radius:50%;border:0;background:var(--lamp);color:var(--lamp-ink);cursor:pointer;display:grid;place-items:center;box-shadow:0 0 0 10px rgba(255,181,71,.12),0 0 80px rgba(255,181,71,.35);transition:transform .15s;flex:none}
.play:active{transform:scale(.96)}
.play svg{width:46px;height:46px}
.now{font-size:14px;color:var(--muted);max-width:28ch}
.now b{display:block;color:var(--text);font-size:16px}
@media (max-width:760px){.top{grid-template-columns:minmax(0,1fr);gap:22px;padding-top:2vh}.player{justify-self:start}.play{width:104px;height:104px}}

.panel{background:var(--glass);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:22px}
.row-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:40px}
.chip:hover{border-color:rgba(237,231,219,.35)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--night);border-color:var(--text)}
.chip small{font-weight:500;opacity:.7}

.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:16px;align-content:start}

/* music */
.styles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:620px){.styles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.style{border:1px solid var(--line);border-radius:16px;padding:12px;background:rgba(255,255,255,.02);text-align:left;cursor:pointer;display:grid;gap:2px;min-height:72px}
.style b{font-size:15px}
.style span{font-size:12px;color:var(--muted);line-height:1.3}
.style[aria-pressed="true"]{border-color:var(--lamp);background:rgba(255,181,71,.10)}
.style[aria-pressed="true"] b{color:var(--lamp)}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;margin-top:14px}
.mrow .lbl{font-weight:700;font-size:14px}
.val{font:600 12px var(--mono);color:var(--muted);min-width:3ch;text-align:right}
.meta{font-size:13px;color:var(--muted);margin-top:8px;min-height:20px}

/* mixer */
.mix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.mix{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ch{border:1px solid var(--line);border-radius:16px;padding:12px 14px 8px;background:rgba(255,255,255,.02);display:grid;gap:4px;transition:border-color .2s,background .2s}
.ch.on{border-color:rgba(255,181,71,.45);background:rgba(255,181,71,.07)}
.ch .h{display:flex;align-items:center;gap:9px;min-width:0}
.ch .ic{width:26px;height:26px;flex:none;color:var(--muted)}
.ch.on .ic{color:var(--lamp)}
.ch .nm{font-weight:700;font-size:14px;line-height:1.2;min-width:0}
.ch .val{margin-left:auto}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--lamp) var(--p),rgba(237,231,219,.16) var(--p))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(237,231,219,.16)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--lamp)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--text);margin-top:-7px;border:0}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--text);border:0}

/* timer */
.dial{position:relative;width:200px;height:200px;margin:18px auto 8px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--lamp) calc(var(--d,0)*1turn),rgba(237,231,219,.10) 0)}
.dial::before{content:"";position:absolute;inset:10px;border-radius:50%;background:#0F1628}
.dial .in{position:relative;text-align:center}
.clock{font:700 46px/1 var(--mono);letter-spacing:-.02em}
.phase{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.custom{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--muted)}
.custom input{width:84px;min-height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:0 10px}
.hint{font-size:13px;color:var(--muted)}
.kbd{font:600 12px var(--mono);border:1px solid var(--line);border-radius:6px;padding:1px 6px}

.foot{position:relative;z-index:1;padding:40px 0 48px;color:var(--muted);font-size:14px}
.foot details{border-top:1px solid var(--line);padding-top:16px;max-width:72ch}
.foot summary{cursor:pointer;color:var(--text);font-weight:700;min-height:32px}
.foot p{margin-top:10px;text-wrap:pretty}
.foot .by{margin-top:22px;display:flex;gap:8px 18px;flex-wrap:wrap}
.foot a{color:var(--text)}
@media (prefers-reduced-motion:reduce){.play{transition:none}}

function F(type,f,q){var x=ctx.createBiquadFilter();x.type=type;x.frequency.value=f;if(q)x.Q.value=q;return x}
function chain(){for(var i=0;i<arguments.length-1;i++)arguments[i].connect(arguments[i+1]);return arguments[arguments.length-1]}
function noiseBuf(kind,sec){
  var n=Math.floor(ctx.sampleRate*sec),b=ctx.createBuffer(2,n,ctx.sampleRate);
  for(var c=0;c<2;c++){var d=b.getChannelData(c),b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;
    for(var i=0;i<n;i++){var w=rnd()*2-1;
      if(kind==="white")d[i]=w*.5;
      else if(kind==="pink"){b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}
      else{last=(last+.02*w)/1.02;d[i]=last*3.5}}
    var f=Math.floor(ctx.sampleRate*.05);for(var j=0;j<f;j++){var a=j/f;d[j]=d[j]*a+d[n-f+j]*(1-a)}}
  return b}
var NBUF={};function nb(k){if(!NBUF[k])NBUF[k]=noiseBuf(k,k==="white"?4:8);return NBUF[k]}
// bake sparse events into a looping stereo buffer
function bake(sec,count,make,spread){var sr=ctx.sampleRate,n=Math.floor(sr*sec),b=ctx.createBuffer(2,n,sr),L=b.getChannelData(0),R=b.getChannelData(1);
  for(var e=0;e<count;e++){var at=Math.floor(rnd()*n),pan=spread==null?rnd():.5+(rnd()-.5)*spread,ev=make(sr,e);
    for(var i=0;i<ev.length;i++){var k=(at+i)%n;L[k]+=ev[i]*(1-pan);R[k]+=ev[i]*pan}}return b}
function loop(buf,dest,rate){var s=ctx.createBufferSource();s.buffer=buf;s.loop=true;if(rate)s.playbackRate.value=rate;s.connect(dest);s.start(ctx.currentTime+.02,rnd()*buf.duration);return s}
function lfo(freq,depth,param,type){var o=ctx.createOscillator();o.type=type||"sine";o.frequency.value=freq;var g=G(depth);o.connect(g);g.connect(param);o.start();return o}
// event generators
function ev(len,fn){return function(sr){var n=Math.floor(sr*len()),a=new Float32Array(n);for(var i=0;i<n;i++)a[i]=fn(i/sr,i,n);return a}}
var drop=function(sr){var n=Math.floor(sr*(.004+rnd()*.02)),a=new Float32Array(n),f=1800+rnd()*4000,amp=(.05+rnd()*.25)*(rnd()<.1?3:1);for(var i=0;i<n;i++){var t=i/sr;a[i]=(rnd()*2-1)*.6*Math.exp(-t*400)*amp+Math.sin(6.283*f*t)*Math.exp(-t*300)*amp*.5}return a};
var thud=function(sr){var n=Math.floor(sr*.06),a=new Float32Array(n),amp=.15+rnd()*.5,f=300+rnd()*500;for(var i=0;i<n;i++){var t=i/sr;a[i]=((rnd()*2-1)*.5+Math.sin(6.283*f*t))*Math.exp(-t*90)*amp}return a};
var crackle=function(sr){var n=Math.floor(sr*(.002+rnd()*.012)),a=new Float32Array(n),amp=.1+Math.pow(rnd(),3)*.9;for(var i=0;i<n;i++)a[i]=(rnd()*2-1)*amp*Math.exp(-i/sr*600);return a};
var tick=function(sr){var a=new Float32Array(Math.floor(sr*.0015)),amp=.05+Math.pow(rnd(),4)*.5;for(var i=0;i<a.length;i++)a[i]=(rnd()*2-1)*amp;return a};
function chirp(sr){ // one bird phrase: 2-6 FM chirps
  var notes=2+Math.floor(rnd()*5),base=2200+rnd()*2500,dur=.07+rnd()*.08,gap=dur*(1.3+rnd()),n=Math.floor(sr*(notes*gap+.1)),a=new Float32Array(n),sweep=(rnd()-.4)*2500,ph=0;
  for(var k=0;k<notes;k++){var s0=Math.floor(k*gap*sr),m=Math.floor(dur*sr),bf=base*(1+(rnd()-.5)*.3);for(var i=0;i<m&&s0+i<n;i++){var t=i/sr,f=bf+sweep*t/dur+Math.sin(t*180)*120;ph+=6.283*f/sr;a[s0+i]+=Math.sin(ph)*Math.sin(Math.PI*i/m)*.25}}return a}
function cricket(sr){var n=Math.floor(sr*.6),a=new Float32Array(n),f=4300+rnd()*600,pulses=3+Math.floor(rnd()*4);for(var i=0;i<n;i++){var t=i/sr,p=Math.floor(t/.045);if(p<pulses){var lt=t-p*.045;a[i]=Math.sin(6.283*f*t)*Math.exp(-lt*70)*.12}}return a}
function bubble(sr){var n=Math.floor(sr*.06),a=new Float32Array(n),f=500+rnd()*1200,ph=0;for(var i=0;i<n;i++){var t=i/sr;ph+=6.283*f*(1+t*14)/sr;a[i]=Math.sin(ph)*Math.exp(-t*60)*(.05+rnd()*.0)*1.6}return a}
function clink(sr){var n=Math.floor(sr*.5),a=new Float32Array(n),f=2500+rnd()*2500,amp=.04+rnd()*.06;for(var i=0;i<n;i++){var t=i/sr;a[i]=(Math.sin(6.283*f*t)+.5*Math.sin(6.283*f*2.76*t))*Math.exp(-t*12)*amp}return a}
function key(sr){var n=Math.floor(sr*.03),a=new Float32Array(n),amp=.08+rnd()*.12,f=1500+rnd()*1500;for(var i=0;i<n;i++){var t=i/sr;a[i]=((rnd()*2-1)*.7+Math.sin(6.283*f*t)*.3)*Math.exp(-t*220)*amp}return a}
function carPass(sr){var len=4+rnd()*3,n=Math.floor(sr*len),a=new Float32Array(n),last=0;for(var i=0;i<n;i++){var t=i/sr,w=rnd()*2-1;last=(last+.08*w)/1.08;var e=Math.exp(-Math.pow((t-len/2)/(len/5),2));a[i]=last*e*1.4}return a}

function mtof(m){return 440*Math.pow(2,(m-69)/12)}
function env(g,t,a,peak,dec,sus,end,rel){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(Math.max(sus,1e-4),t+a+dec);g.gain.setValueAtTime(Math.max(sus,1e-4),end);g.gain.exponentialRampToValueAtTime(1e-4,end+rel)}
function oscs(list,t,stop){list.forEach(function(o){o.start(t);o.stop(stop)})}

   mg.gain.setValueAtTime(f*1.4*v,t);mg.gain.exponentialRampToValueAtTime(f*.15+1,t+.8);env(g,t,.006,.09*v,.5,.035*v,t+dur,1.2);

   mo.connect(mg);mg.connect(c.frequency);c.connect(g);g.connect(out);bell.connect(bg);bg.connect(out);oscs([c,mo,bell],t,t+dur+1.4)},

function Engine(style){
  this.style=style;this.cfg=STY[style];this.out=G(0);this.out.connect(musicBus);this.out.gain.setTargetAtTime({jazz:1,lofi:1,bossa:2,piano:2.8,ambient:2.8}[style],ctx.currentTime,.3);
  if(style==="lofi"){this.wob=ctx.createOscillator();this.wob.frequency.value=.45;this.wobG=G(9);this.wob.connect(this.wobG);this.wob.start();this.dust=G(1);this.lp=F("lowpass",3200);this.out.disconnect();this.out.connect(this.lp);this.lp.connect(musicBus)}
  this.next=ctx.currentTime+.15;this.bar=0;this.lastMel=0;this.newChorus();
}
Engine.prototype.newChorus=function(){var c=this.cfg;this.key=KEYS[Math.floor(rnd()*KEYS.length)];this.prog=c.progs[Math.floor(rnd()*c.progs.length)];this.bpm=c.bpm[0]+Math.floor(rnd()*(c.bpm[1]-c.bpm[0]+1));this.bar=0;renderMeta()};
Engine.prototype.stop=function(){var g=this.out;g.gain.setTargetAtTime(0,ctx.currentTime,.15);setTimeout(function(){try{g.disconnect()}catch(e){}},2000);if(this.wob)this.wob.stop(ctx.currentTime+1)};
Engine.prototype.schedule=function(until){if(this.next<ctx.currentTime)this.next=ctx.currentTime+.1;
  while(this.next<until){var beat=60/this.bpm,len=4*beat,c=this.cfg,ci=Math.floor(this.bar/c.chordBars)%4,ch=this.prog[ci],nx=this.prog[(ci+1)%4];
