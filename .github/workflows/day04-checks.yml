name: Day 04 Productivity Studio checks
on:
  push:
    branches: [main]
    paths:
      - 'day-04-productivity-library/**'
      - 'scripts/check-day04.mjs'
      - 'index.html'
      - '.github/workflows/day04-checks.yml'
  pull_request:
    paths:
      - 'day-04-productivity-library/**'
      - 'scripts/check-day04.mjs'
      - 'index.html'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate 50 tools and 600 export flows
        run: node scripts/check-day04.mjs
