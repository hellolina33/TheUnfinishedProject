<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941">
  <rect width="1672" height="941" fill="#A9D6FF"/>
  <circle cx="205" cy="175" r="130" fill="#CBE6FF"/>
  <circle cx="1495" cy="790" r="175" fill="#CBE6FF"/>

  <!-- Back Flashcard (rotated left) -->
  <g transform="rotate(-10 560 470)">
    <rect x="240" y="160" width="600" height="630" rx="52" fill="#FFD84D" stroke="#17141F" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- Middle Flashcard (rotated slightly right) -->
  <g transform="rotate(5 680 480)">
    <rect x="330" y="150" width="600" height="630" rx="52" fill="#3FD0A0" stroke="#17141F" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- Front Main Flashcard -->
  <g transform="rotate(-2 620 480)">
    <g transform="translate(14 16)" opacity="0.16" fill="#17141F" stroke="#17141F" stroke-width="8">
      <rect x="260" y="135" width="660" height="670" rx="54"/>
    </g>
    <rect x="260" y="135" width="660" height="670" rx="54" fill="#FFF8EA" stroke="#17141F" stroke-width="8" stroke-linejoin="round"/>

    <!-- Top visual icon badge (Bowl + chopsticks / Globe) -->
    <rect x="325" y="200" width="210" height="210" rx="44" fill="#A9D6FF" stroke="#17141F" stroke-width="8"/>
    <!-- Cute smiling globe inside badge -->
    <circle cx="430" cy="305" r="68" fill="#FFFFFF" stroke="#17141F" stroke-width="8"/>
    <ellipse cx="430" cy="305" rx="32" ry="68" fill="none" stroke="#17141F" stroke-width="7"/>
    <line x1="362" y1="305" x2="498" y2="305" stroke="#17141F" stroke-width="7"/>

    <!-- Star badge top-right -->
    <polygon points="820,210 836,248 878,252 846,279 856,320 820,298 784,320 794,279 762,252 804,248" fill="#FFD84D" stroke="#17141F" stroke-width="7" stroke-linejoin="round"/>

    <!-- Bold script bars (zero text clutter) -->
    <rect x="325" y="465" width="520" height="44" rx="22" fill="#17141F"/>
    <rect x="325" y="535" width="380" height="32" rx="16" fill="#FF8F6B" stroke="#17141F" stroke-width="6"/>
    <rect x="325" y="595" width="440" height="24" rx="12" fill="#17141F" opacity="0.22"/>

    <!-- Bottom action pills -->
    <rect x="325" y="670" width="245" height="78" rx="26" fill="#3FD0A0" stroke="#17141F" stroke-width="8"/>
    <rect x="595" y="670" width="255" height="78" rx="26" fill="#17141F" stroke="#17141F" stroke-width="8"/>
    <!-- Speaker icon inside green pill -->
    <polygon points="410,700 432,700 452,684 452,734 432,718 410,718" fill="#FFF8EA" stroke="#17141F" stroke-width="5" stroke-linejoin="round"/>
    <path d="M468 696 Q482 709 468 722" fill="none" stroke="#FFF8EA" stroke-width="7" stroke-linecap="round"/>
    <!-- Expand arrows inside dark pill -->
    <path d="M695 724 L745 694 M724 692 H747 V715" fill="none" stroke="#FFF8EA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Floating Speech Bubble with Sound Waves -->
  <g transform="rotate(7 1315 470)">
    <g transform="translate(12 14)" opacity="0.16" fill="#17141F" stroke="#17141F" stroke-width="8">
      <rect x="1090" y="255" width="430" height="330" rx="68"/>
    </g>
    <path d="M1158 255 H1452 C1490 255 1520 285 1520 323 V517 C1520 555 1490 585 1452 585 H1250 L1145 660 L1170 585 H1158 C1120 585 1090 555 1090 517 V323 C1090 285 1120 255 1158 255 Z" fill="#FF8F6B" stroke="#17141F" stroke-width="8" stroke-linejoin="round"/>

    <!-- Cute smiling face & sound dots inside speech bubble -->
    <circle cx="1235" cy="395" r="18" fill="#17141F"/>
    <circle cx="1375" cy="395" r="18" fill="#17141F"/>
    <path d="M1260 445 Q1305 490 1350 445" fill="none" stroke="#17141F" stroke-width="10" stroke-linecap="round"/>
    <circle cx="1185" cy="435" r="16" fill="#FFB8DE" opacity="0.8"/>
    <circle cx="1425" cy="435" r="16" fill="#FFB8DE" opacity="0.8"/>
  </g>

  <!-- Sparkles -->
  <path d="M1065 92 Q1065 134 1107 134 Q1065 134 1065 176 Q1065 134 1023 134 Q1065 134 1065 92Z" fill="#FFD84D" stroke="#17141F" stroke-width="5" stroke-linejoin="round"/>
  <path d="M1562 248 Q1562 282 1596 282 Q1562 282 1562 316 Q1562 282 1528 282 Q1562 282 1562 248Z" fill="#FFB8DE" stroke="#17141F" stroke-width="5" stroke-linejoin="round"/>
  <path d="M1070 818 Q1070 848 1100 848 Q1070 848 1070 878 Q1070 848 1040 848 Q1070 848 1070 818Z" fill="#3FD0A0" stroke="#17141F" stroke-width="5" stroke-linejoin="round"/>
</svg>
