    <circle cx="300" cy="692" r="14" fill="#17141F"/><circle cx="360" cy="692" r="14" fill="#17141F"/><circle cx="420" cy="692" r="14" fill="#17141F"/><circle cx="480" cy="692" r="14" fill="#17141F"/><circle cx="540" cy="692" r="14" fill="#17141F"/><circle cx="600" cy="692" r="14" fill="#17141F"/><circle cx="660" cy="692" r="14" fill="#17141F"/>

