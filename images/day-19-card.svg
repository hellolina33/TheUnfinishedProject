<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941">
  <rect width="1672" height="941" fill="#3FD0A0"/>
  <circle cx="210" cy="175" r="130" fill="#6BE0B8"/>
  <circle cx="1490" cy="790" r="180" fill="#6BE0B8"/>

  <!-- Main Audio Deck -->
  <g transform="rotate(-2.5 760 475)">
    <g transform="translate(14 16)" opacity="0.16" fill="#17141F" stroke="#17141F" stroke-width="8">
      <rect x="180" y="150" width="1040" height="640" rx="56"/>
    </g>
    <rect x="180" y="150" width="1040" height="640" rx="56" fill="#FFF8EA" stroke="#17141F" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Waveform Screen -->
    <rect x="240" y="210" width="920" height="310" rx="34" fill="#17141F" stroke="#17141F" stroke-width="8" stroke-linejoin="round"/>
    <!-- Highlighted trim window -->
    <rect x="420" y="226" width="520" height="278" rx="18" fill="#252B3B"/>

    <!-- Waveform bars (dimmed outside trim, bright mint inside trim) -->
    <g stroke-linecap="round">
      <rect x="278" y="330" width="18" height="70" rx="9" fill="#525A70"/>
      <rect x="314" y="295" width="18" height="140" rx="9" fill="#525A70"/>
      <rect x="350" y="315" width="18" height="100" rx="9" fill="#525A70"/>
      <rect x="386" y="340" width="18" height="50" rx="9" fill="#525A70"/>

      <rect x="442" y="305" width="18" height="120" rx="9" fill="#3FD0A0"/>
      <rect x="478" y="265" width="18" height="200" rx="9" fill="#3FD0A0"/>
      <rect x="514" y="248" width="18" height="234" rx="9" fill="#FFD84D"/>
      <rect x="550" y="285" width="18" height="160" rx="9" fill="#3FD0A0"/>
      <rect x="586" y="320" width="18" height="90" rx="9" fill="#3FD0A0"/>
      <rect x="622" y="260" width="18" height="210" rx="9" fill="#3FD0A0"/>
      <rect x="658" y="242" width="18" height="246" rx="9" fill="#FFD84D"/>
      <rect x="694" y="275" width="18" height="180" rx="9" fill="#3FD0A0"/>
      <rect x="730" y="298" width="18" height="134" rx="9" fill="#3FD0A0"/>
      <rect x="766" y="255" width="18" height="220" rx="9" fill="#3FD0A0"/>
      <rect x="802" y="280" width="18" height="170" rx="9" fill="#FFD84D"/>
      <rect x="838" y="310" width="18" height="110" rx="9" fill="#3FD0A0"/>
      <rect x="874" y="270" width="18" height="190" rx="9" fill="#3FD0A0"/>
      <rect x="910" y="318" width="18" height="94" rx="9" fill="#3FD0A0"/>

      <rect x="966" y="332" width="18" height="66" rx="9" fill="#525A70"/>
      <rect x="1002" y="302" width="18" height="126" rx="9" fill="#525A70"/>
      <rect x="1038" y="322" width="18" height="86" rx="9" fill="#525A70"/>
      <rect x="1074" y="340" width="18" height="50" rx="9" fill="#525A70"/>
      <rect x="1110" y="348" width="18" height="34" rx="9" fill="#525A70"/>
    </g>

    <!-- Trim Handles -->
    <line x1="420" y1="218" x2="420" y2="512" stroke="#FF8F6B" stroke-width="10" stroke-linecap="round"/>
    <rect x="400" y="196" width="40" height="44" rx="14" fill="#FF8F6B" stroke="#17141F" stroke-width="7"/>
    <line x1="940" y1="218" x2="940" y2="512" stroke="#FF8F6B" stroke-width="10" stroke-linecap="round"/>
    <rect x="920" y="196" width="40" height="44" rx="14" fill="#FF8F6B" stroke="#17141F" stroke-width="7"/>

    <!-- Bottom Controls: Play button + Speed Fader + Export Pill -->
    <circle cx="315" cy="650" r="68" fill="#FFD84D" stroke="#17141F" stroke-width="8"/>
    <path d="M297 616 L352 650 L297 684 Z" fill="#17141F" stroke="#17141F" stroke-width="6" stroke-linejoin="round"/>

    <!-- Speed Slider Track -->
    <rect x="430" y="632" width="440" height="36" rx="18" fill="#E9E4D8" stroke="#17141F" stroke-width="7"/>
    <rect x="430" y="632" width="290" height="36" rx="18" fill="#3FD0A0" stroke="#17141F" stroke-width="7"/>
    <circle cx="720" cy="650" r="34" fill="#FFFFFF" stroke="#17141F" stroke-width="8"/>
    <circle cx="720" cy="650" r="11" fill="#17141F"/>

    <!-- Speed ticks -->
    <line x1="460" y1="595" x2="460" y2="612" stroke="#17141F" stroke-width="7" stroke-linecap="round"/>
    <line x1="555" y1="595" x2="555" y2="612" stroke="#17141F" stroke-width="7" stroke-linecap="round"/>
    <line x1="650" y1="590" x2="650" y2="612" stroke="#17141F" stroke-width="7" stroke-linecap="round"/>
    <line x1="745" y1="595" x2="745" y2="612" stroke="#17141F" stroke-width="7" stroke-linecap="round"/>
    <line x1="840" y1="595" x2="840" y2="612" stroke="#17141F" stroke-width="7" stroke-linecap="round"/>

    <!-- WAV Export Button -->
    <rect x="920" y="596" width="236" height="108" rx="30" fill="#A9D6FF" stroke="#17141F" stroke-width="8"/>
    <path d="M1038 622 V668 M1014 648 L1038 672 L1062 648" fill="none" stroke="#17141F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="998" y1="684" x2="1078" y2="684" stroke="#17141F" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Floating Rotary Dial Mascot on Right -->
  <g transform="rotate(9 1385 450)">
    <g transform="translate(12 14)" opacity="0.16" fill="#17141F" stroke="#17141F" stroke-width="8">
      <circle cx="1385" cy="450" r="142"/>
    </g>
    <circle cx="1385" cy="450" r="142" fill="#FFB8DE" stroke="#17141F" stroke-width="8"/>
    <circle cx="1385" cy="450" r="98" fill="#FFF8EA" stroke="#17141F" stroke-width="8"/>
    <line x1="1385" y1="364" x2="1385" y2="404" stroke="#FF8F6B" stroke-width="12" stroke-linecap="round"/>
    <circle cx="1352" cy="455" r="12" fill="#17141F"/>
    <circle cx="1418" cy="455" r="12" fill="#17141F"/>
    <path d="M1358 486 Q1385 512 1412 486" fill="none" stroke="#17141F" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Sparkles -->
  <path d="M1260 112 Q1260 152 1300 152 Q1260 152 1260 192 Q1260 152 1220 152 Q1260 152 1260 112Z" fill="#FFD84D" stroke="#17141F" stroke-width="5" stroke-linejoin="round"/>
  <path d="M1535 230 Q1535 262 1567 262 Q1535 262 1535 294 Q1535 262 1503 262 Q1535 262 1535 230Z" fill="#FFFFFF" stroke="#17141F" stroke-width="5" stroke-linejoin="round"/>
  <path d="M1290 770 Q1290 802 1322 802 Q1290 802 1290 834 Q1290 802 1258 802 Q1290 802 1290 770Z" fill="#FFB8DE" stroke="#17141F" stroke-width="5" stroke-linejoin="round"/>
</svg>
