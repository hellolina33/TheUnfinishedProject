<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941">
  <!-- Pink pastel background -->
  <rect width="1672" height="941" fill="#FFB8DE"/>
  <circle cx="220" cy="190" r="145" fill="#FFD6EC"/>
  <circle cx="1470" cy="770" r="185" fill="#FFD6EC"/>

  <!-- 4-Panel Comic Page -->
  <g transform="rotate(-2.5 760 475)">
