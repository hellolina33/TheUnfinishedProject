<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941">
  <rect width="1672" height="941" fill="#A9D6FF"/>
  <circle cx="185" cy="175" r="130" fill="#C9E6FF"/>
  <circle cx="1495" cy="790" r="185" fill="#C9E6FF"/>

  <!-- Main Tetris Timezone Board -->
  <g transform="rotate(-2.5 640 470)">
    <g transform="translate(14 16)" opacity="0.16" fill="#17141F" stroke="#17141F" stroke-width="8">
      <rect x="170" y="130" width="900" height="680" rx="52"/>
    </g>
    <rect x="170" y="130" width="900" height="680" rx="52" fill="#FFFDF7" stroke="#17141F" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Golden Overlap Vertical Highlight Column -->
    <rect x="598" y="176" width="116" height="588" rx="22" fill="#FFF3B0" stroke="#EAB308" stroke-width="6" stroke-dasharray="14 10"/>

    <!-- Row 1: Bangkok -->
    <circle cx="242" cy="242" r="28" fill="#FFE15D" stroke="#17141F" stroke-width="7"/>
    <rect x="304" y="206" width="180" height="72" rx="18" fill="#CBD5E1" stroke="#17141F" stroke-width="7"/>
    <rect x="498" y="206" width="216" height="72" rx="18" fill="#3FD0A0" stroke="#17141F" stroke-width="7"/>
    <rect x="728" y="206" width="126" height="72" rx="18" fill="#FFD84D" stroke="#17141F" stroke-width="7"/>
    <rect x="868" y="206" width="144" height="72" rx="18" fill="#CBD5E1" stroke="#17141F" stroke-width="7"/>

    <!-- Row 2: Paris -->
    <circle cx="242" cy="368" r="28" fill="#A9D6FF" stroke="#17141F" stroke-width="7"/>
    <rect x="304" y="332" width="110" height="72" rx="18" fill="#CBD5E1" stroke="#17141F" stroke-width="7"/>
    <rect x="428" y="332" width="112" height="72" rx="18" fill="#FFD84D" stroke="#17141F" stroke-width="7"/>
    <rect x="554" y="332" width="290" height="72" rx="18" fill="#3FD0A0" stroke="#17141F" stroke-width="7"/>
    <rect x="858" y="332" width="154" height="72" rx="18" fill="#CBD5E1" stroke="#17141F" stroke-width="7"/>

    <!-- Row 3: London -->
    <circle cx="242" cy="494" r="28" fill="#9CF0C7" stroke="#17141F" stroke-width="7"/>
    <rect x="304" y="458" width="150" height="72" rx="18" fill="#CBD5E1" stroke="#17141F" stroke-width="7"/>
    <rect x="468" y="458" width="116" height="72" rx="18" fill="#FFD84D" stroke="#17141F" stroke-width="7"/>
    <rect x="598" y="458" width="290" height="72" rx="18" fill="#3FD0A0" stroke="#17141F" stroke-width="7"/>
    <rect x="902" y="458" width="110" height="72" rx="18" fill="#CBD5E1" stroke="#17141F" stroke-width="7"/>

    <!-- Row 4: New York (L-shaped Tetris block feel) -->
    <circle cx="242" cy="620" r="28" fill="#FFB8DE" stroke="#17141F" stroke-width="7"/>
    <rect x="304" y="584" width="220" height="72" rx="18" fill="#CBD5E1" stroke="#17141F" stroke-width="7"/>
    <rect x="538" y="584" width="294" height="72" rx="18" fill="#3FD0A0" stroke="#17141F" stroke-width="7"/>
    <rect x="846" y="584" width="166" height="72" rx="18" fill="#FFD84D" stroke="#17141F" stroke-width="7"/>

    <!-- Little golden crown/star pin at top of overlap column -->
    <circle cx="656" cy="176" r="26" fill="#FFE15D" stroke="#17141F" stroke-width="7"/>
    <path d="M656 161 L661 171 L672 172 L664 179 L666 190 L656 184 L646 190 L648 179 L640 172 L651 171 Z" fill="#17141F"/>
  </g>

  <!-- Cheerful Clock / Globe Buddy on the right -->
  <g transform="rotate(6 1345 470)">
    <g transform="translate(14 16)" opacity="0.16" fill="#17141F" stroke="#17141F" stroke-width="8">
      <circle cx="1345" cy="465" r="165"/>
    </g>
    <!-- Alarm bells -->
    <circle cx="1225" cy="335" r="46" fill="#FF8F6B" stroke="#17141F" stroke-width="8"/>
    <circle cx="1465" cy="335" r="46" fill="#FF8F6B" stroke="#17141F" stroke-width="8"/>
    <!-- Legs -->
    <path d="M1245 605 L1215 655" stroke="#17141F" stroke-width="14" stroke-linecap="round"/>
    <path d="M1445 605 L1475 655" stroke="#17141F" stroke-width="14" stroke-linecap="round"/>
    <!-- Clock body -->
    <circle cx="1345" cy="465" r="165" fill="#FFE15D" stroke="#17141F" stroke-width="8"/>
    <circle cx="1345" cy="465" r="130" fill="#FFFFFF" stroke="#17141F" stroke-width="8"/>
    <!-- Clock hands -->
    <line x1="1345" y1="465" x2="1345" y2="385" stroke="#17141F" stroke-width="10" stroke-linecap="round"/>
    <line x1="1345" y1="465" x2="1410" y2="435" stroke="#3FD0A0" stroke-width="10" stroke-linecap="round"/>
    <circle cx="1345" cy="465" r="14" fill="#17141F"/>
    <!-- Cute face below center -->
    <circle cx="1302" cy="515" r="11" fill="#17141F"/>
    <circle cx="1388" cy="515" r="11" fill="#17141F"/>
    <path d="M1320 538 Q1345 562 1370 538" fill="none" stroke="#17141F" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Playful Sparkles -->
  <path d="M1140 96 Q1140 136 1180 136 Q1140 136 1140 176 Q1140 136 1100 136 Q1140 136 1140 96Z" fill="#FFE15D" stroke="#17141F" stroke-width="5" stroke-linejoin="round"/>
  <path d="M1565 250 Q1565 282 1597 282 Q1565 282 1565 314 Q1565 282 1533 282 Q1565 282 1565 250Z" fill="#FFB8DE" stroke="#17141F" stroke-width="5" stroke-linejoin="round"/>
  <path d="M1155 805 Q1155 835 1185 835 Q1155 835 1155 865 Q1155 835 1125 835 Q1155 835 1155 805Z" fill="#3FD0A0" stroke="#17141F" stroke-width="5" stroke-linejoin="round"/>
</svg>
