<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941">
  <rect width="1672" height="941" fill="#D8C6FA"/>
  <circle cx="195" cy="175" r="130" fill="#EADFFF"/>
  <circle cx="1495" cy="800" r="175" fill="#EADFFF"/>

  <!-- Studio Portrait Card -->
  <g transform="rotate(-3 720 475)">
    <g transform="translate(14 16)" opacity="0.16" fill="#17141F" stroke="#17141F" stroke-width="8">
      <rect x="275" y="125" width="760" height="690" rx="56"/>
    </g>
    <rect x="275" y="125" width="760" height="690" rx="56" fill="#FFF8EA" stroke="#17141F" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Circular Avatar Ring & Portrait -->
    <circle cx="655" cy="435" r="245" fill="#FFD84D" stroke="#17141F" stroke-width="8"/>
    <circle cx="655" cy="435" r="215" fill="#A9D6FF" stroke="#17141F" stroke-width="8"/>

    <!-- Clip-safe stylized portrait inside circle -->
    <defs>
      <clipPath id="avatarClip">
        <circle cx="655" cy="435" r="211"/>
      </clipPath>
    </defs>
    <g clip-path="url(#avatarClip)">
      <!-- Studio backdrop glow -->
      <circle cx="655" cy="400" r="165" fill="#C9E6FF"/>
      <!-- Shoulders / Blazer -->
      <path d="M475 670 C490 545 565 510 655 510 C745 510 820 545 835 670 Z" fill="#2A2438" stroke="#17141F" stroke-width="8" stroke-linejoin="round"/>
      <!-- Shirt collar -->
      <path d="M615 512 L655 575 L695 512 Z" fill="#FFF8EA" stroke="#17141F" stroke-width="7" stroke-linejoin="round"/>
      <!-- Neck -->
      <rect x="625" y="458" width="60" height="68" rx="24" fill="#F6C19B" stroke="#17141F" stroke-width="8"/>
      <!-- Head -->
      <circle cx="655" cy="390" r="88" fill="#F6C19B" stroke="#17141F" stroke-width="8"/>
      <!-- Hair -->
      <path d="M565 375 C565 295 620 278 665 280 C720 282 752 320 745 380 C725 342 685 330 635 338 C595 344 580 358 565 375 Z" fill="#17141F" stroke="#17141F" stroke-width="8" stroke-linejoin="round"/>
      <!-- Friendly Face -->
      <circle cx="624" cy="392" r="11" fill="#17141F"/>
      <circle cx="686" cy="392" r="11" fill="#17141F"/>
      <path d="M625 426 Q655 454 685 426" fill="none" stroke="#17141F" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Studio Slider Pills at bottom of card -->
    <rect x="355" y="720" width="160" height="24" rx="12" fill="#FFB8DE" stroke="#17141F" stroke-width="6"/>
    <circle cx="445" cy="732" r="20" fill="#FFF8EA" stroke="#17141F" stroke-width="7"/>
    <rect x="550" y="720" width="190" height="24" rx="12" fill="#3FD0A0" stroke="#17141F" stroke-width="6"/>
    <circle cx="675" cy="732" r="20" fill="#FFF8EA" stroke="#17141F" stroke-width="7"/>
    <rect x="775" y="720" width="175" height="24" rx="12" fill="#FFD84D" stroke="#17141F" stroke-width="6"/>
    <circle cx="845" cy="732" r="20" fill="#FFF8EA" stroke="#17141F" stroke-width="7"/>
  </g>

  <!-- Studio Camera / Softbox Flash Badge (Right) -->
  <g transform="rotate(8 1300 475)">
    <g transform="translate(12 14)" opacity="0.16" fill="#17141F" stroke="#17141F" stroke-width="8">
      <rect x="1135" y="340" width="330" height="250" rx="48"/>
    </g>
    <!-- Top viewfinder bump -->
    <path d="M1225 340 L1250 288 H1350 L1375 340 Z" fill="#FF8F6B" stroke="#17141F" stroke-width="8" stroke-linejoin="round"/>
    <!-- Camera Body -->
    <rect x="1135" y="340" width="330" height="250" rx="48" fill="#FF8F6B" stroke="#17141F" stroke-width="8" stroke-linejoin="round"/>
    <!-- Shutter Button -->
    <rect x="1175" y="314" width="44" height="26" rx="10" fill="#FFD84D" stroke="#17141F" stroke-width="7"/>
    <!-- Lens -->
    <circle cx="1300" cy="465" r="88" fill="#FFF8EA" stroke="#17141F" stroke-width="8"/>
    <circle cx="1300" cy="465" r="56" fill="#1E192B" stroke="#17141F" stroke-width="8"/>
    <circle cx="1282" cy="446" r="16" fill="#A9D6FF"/>
    <!-- Flash dot -->
    <circle cx="1412" cy="390" r="16" fill="#FFD84D" stroke="#17141F" stroke-width="6"/>
  </g>

  <!-- Playful Sparkles -->
  <path d="M1140 120 Q1140 162 1182 162 Q1140 162 1140 204 Q1140 162 1098 162 Q1140 162 1140 120Z" fill="#FFD84D" stroke="#17141F" stroke-width="5" stroke-linejoin="round"/>
  <path d="M1535 235 Q1535 270 1570 270 Q1535 270 1535 305 Q1535 270 1500 270 Q1535 270 1535 235Z" fill="#3FD0A0" stroke="#17141F" stroke-width="5" stroke-linejoin="round"/>
  <path d="M165 730 Q165 765 200 765 Q165 765 165 800 Q165 765 130 765 Q165 765 165 730Z" fill="#FFB8DE" stroke="#17141F" stroke-width="5" stroke-linejoin="round"/>
</svg>
