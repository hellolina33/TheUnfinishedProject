    <rect x="1195" y="355" width="310" height="240" rx="44" fill="#FF8F6B" stroke="#17141F" stroke-width="8" stroke-linejoin="round"/>
    <!-- Flap -->
    <path d="M1195 452 Q1350 510 1505 452 L1505 399 C1505 375 1485 355 1461 355 L1239 355 C1215 355 1195 375 1195 399 Z" fill="#FFD84D" stroke="#17141F" stroke-width="8" stroke-linejoin="round"/>
    <!-- Clasp -->
    <rect x="1322" y="452" width="56" height="44" rx="14" fill="#FFF8EA" stroke="#17141F" stroke-width="8"/>
    <!-- Cute face -->
    <circle cx="1272" cy="532" r="12" fill="#17141F"/>
    <circle cx="1428" cy="532" r="12" fill="#17141F"/>
    <path d="M1325 544 Q1350 568 1375 544" fill="none" stroke="#17141F" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Paper plane swooping top right -->
  <g transform="translate(1240 165) rotate(-14)">
    <path d="M0 70 L170 10 L118 140 L82 92 Z" fill="#FFF8EA" stroke="#17141F" stroke-width="8" stroke-linejoin="round"/>
    <path d="M170 10 L82 92 L78 138 L108 106" fill="#A9D6FF" stroke="#17141F" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- Playful sparkles -->
  <path d="M1160 88 Q1160 126 1198 126 Q1160 126 1160 164 Q1160 126 1122 126 Q1160 126 1160 88Z" fill="#FFD84D" stroke="#17141F" stroke-width="6" stroke-linejoin="round"/>
  <path d="M1558 310 Q1558 344 1592 344 Q1558 344 1558 378 Q1558 344 1524 344 Q1558 344 1558 310Z" fill="#3FD0A0" stroke="#17141F" stroke-width="6" stroke-linejoin="round"/>
  <path d="M1152 818 Q1152 850 1184 850 Q1152 850 1152 882 Q1152 850 1120 850 Q1152 850 1152 818Z" fill="#FFB8DE" stroke="#17141F" stroke-width="6" stroke-linejoin="round"/>
</svg>
