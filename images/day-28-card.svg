    <rect x="392" y="330" width="128" height="84" rx="18" fill="#FFD84D" stroke="#17141F" stroke-width="7"/>
    <rect x="570" y="330" width="128" height="84" rx="18" fill="#A9D6FF" stroke="#17141F" stroke-width="7"/>
    <rect x="392" y="448" width="128" height="84" rx="18" fill="#A9D6FF" stroke="#17141F" stroke-width="7"/>
    <rect x="570" y="448" width="128" height="84" rx="18" fill="#FFFFFF" stroke="#17141F" stroke-width="7"/>
    <rect x="392" y="566" width="128" height="84" rx="18" fill="#FFFFFF" stroke="#17141F" stroke-width="7"/>
