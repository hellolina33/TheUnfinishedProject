  <path d="M210 380 Q210 416 246 416 Q210 416 210 452 Q210 416 174 416 Q210 416 210 380Z" fill="#FFD84D" stroke="#17141F" stroke-width="5" stroke-linejoin="round"/>
  <path d="M1480 280 Q1480 314 1514 314 Q1480 314 1480 348 Q1480 314 1446 314 Q1480 314 1480 280Z" fill="#3FD0A0" stroke="#17141F" stroke-width="5" stroke-linejoin="round"/>
