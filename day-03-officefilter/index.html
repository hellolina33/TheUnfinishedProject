<style>
:root {
  --bg: #FAF6EE; --paper: #FFFFFF; --ink: #23211F; --muted: #6B655E; --line: #E4DCCD; --soft: #F2EBDD;
  --accent: #FF5A1F; --accent-ink: #FFFFFF; --ok: #1F7A4D; --err: #B42318;
  --r: 14px;
  --f: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f); }
a { color: inherit; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* challenge strip */
.chbar { background: var(--ink); color: #FAF6EE; font-size: 13px; }
.chbar .wrap { display: flex; flex-wrap: wrap; gap: 2px 14px; justify-content: space-between; padding-block: 7px; }
.chbar a { color: #FFB08F; font-weight: 700; text-decoration: none; }
@media (max-width: 520px) { .chtag { display: none; } }

/* header */
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 16px; }
.brand { white-space: nowrap; display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; text-decoration: none; }
.brand .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); position: relative; flex: none; }
.brand .mark::after { content: ""; position: absolute; left: 5px; right: 5px; top: 11px; height: 4px; border-radius: 2px; background: var(--accent); }
.top .sp { flex: 1; }
@media (max-width: 400px) { header.top .wrap { gap: 8px; } .brand { font-size: 17px; gap: 8px; } .iconbtn { padding: 0 10px; } .seg button { min-width: 34px; } }
.iconbtn { white-space: nowrap; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; min-height: 40px; padding: 0 14px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.iconbtn[aria-pressed="true"], .iconbtn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--paper); }
.seg button { border: 0; background: transparent; border-radius: 999px; min-height: 34px; min-width: 40px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: inline-block; }
.dot.on { background: var(--ok); }

/* hero */
.hero { padding-block: 18px 8px; }
h1 { margin: 0; font-size: clamp(34px, 6vw, 60px); line-height: 1.02; letter-spacing: -0.035em; font-weight: 850; max-width: 16ch; }
h1 .strike { position: relative; color: var(--muted); }
h1 .strike::after { content: ""; position: absolute; left: -2%; right: -2%; top: 52%; height: 0.09em; background: var(--accent); transform: rotate(-3deg); }
.lead { margin: 12px 0 0; color: var(--muted); font-size: 18px; max-width: 58ch; }

/* settings panel */
.settings { margin-top: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.settings h2 { margin: 0; font-size: 16px; }
.provs { display: flex; flex-wrap: wrap; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
input[type="text"], input[type="password"], select, textarea { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; min-height: 44px; padding: 8px 12px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.hint a { font-weight: 700; color: var(--ink); }

/* composer */
.composer { margin-top: 16px; background: var(--paper); border: 2px solid var(--ink); border-radius: 18px; padding: 16px; box-shadow: 6px 6px 0 var(--ink); }
.composer label.big { display: block; font-weight: 800; font-size: 20px; letter-spacing: -0.01em; margin-bottom: 8px; }
#raw { min-height: 140px; resize: vertical; border: 0; background: var(--soft); border-radius: 12px; font-size: 20px; line-height: 1.4; padding: 14px; }
#raw::placeholder { color: #A39A8E; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.examples .lbl { font-size: 13px; color: var(--muted); margin-right: 2px; }
.chip { border: 1px dashed #CDBFA8; background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; text-align: left; min-height: 36px; }
.chip:hover { border-style: solid; }
.params { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
@media (max-width: 760px) { .params { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ctx { margin-top: 10px; }
.ctx summary { cursor: pointer; font-size: 14px; font-weight: 700; min-height: 32px; display: flex; align-items: center; }
.go { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.btn { border: 2px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 12px; min-height: 50px; padding: 0 22px; font-weight: 800; font-size: 17px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.sm { min-height: 40px; font-size: 14px; padding: 0 14px; font-weight: 700; border-radius: 10px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.notice { font-size: 13px; color: var(--muted); margin: 0; }
.notice b { color: var(--ink); }

/* status */
.status { margin-top: 14px; border-radius: 12px; padding: 12px 14px; font-size: 15px; display: none; }
.status.show { display: block; }
.status.err { background: #FDECEA; color: var(--err); border: 1px solid #F6C7C1; }
.status.info { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
.status .acts { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }

/* transformation strip */
.transform { margin-top: 22px; display: none; align-items: center; gap: 12px; flex-wrap: wrap; }
.transform.show { display: flex; }
.rawpill { position: relative; background: var(--paper); border: 1px dashed #CDBFA8; border-radius: 999px; padding: 6px 14px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rawpill::after { content: ""; position: absolute; left: 10px; right: 10px; top: 50%; height: 2px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 0.6s ease; }
.transform.done .rawpill::after { transform: scaleX(1); }
.arrow { font-weight: 800; color: var(--accent); font-size: 20px; }
.tag { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 4px 8px; }

/* results */
.results { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
@media (max-width: 860px) { .results { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; opacity: 0; transform: translateY(10px); transition: opacity 0.35s ease, transform 0.35s ease, border-color 0.2s; position: relative; }
.card.in { opacity: 1; transform: none; }
.card.sel { border: 2px solid var(--accent); padding: 15px; }
.card h3 { margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.card h3 .bar { width: 22px; height: 6px; border-radius: 3px; background: var(--accent); }
.card[data-tone="diplomatic"] h3 .bar { opacity: 0.35; }
.card[data-tone="direct"] h3 .bar { opacity: 0.65; }
.card .goal { margin: 0; font-size: 13px; color: var(--muted); }
.card .text { margin: 0; font-size: 17px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--soft); border-radius: 10px; padding: 12px; }
.card .when { margin: 0; font-size: 14px; color: var(--muted); }
.card .when b { color: var(--ink); }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
.card .copied { color: var(--ok); font-weight: 700; font-size: 14px; align-self: center; }
.card.skel .text { color: transparent; background: linear-gradient(90deg, var(--soft), #EAE1CF, var(--soft)); background-size: 200% 100%; animation: sh 1.2s linear infinite; min-height: 110px; }
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .card, .rawpill::after { transition: none; } .card.skel .text { animation: none; } }
.manual { width: 100%; min-height: 90px; font-size: 14px; }
.assume { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.assume b { color: var(--ink); }
.demo-flag { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 700; background: #FFF1E9; color: #9A3412; border: 1px solid #FFD2BC; border-radius: 8px; padding: 4px 10px; }

.revise { margin-top: 14px; display: none; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; gap: 10px; align-items: center; flex-wrap: wrap; }
.revise.show { display: flex; }
.revise p { margin: 0; font-size: 14px; color: var(--muted); flex-basis: 100%; }

.empty { margin-top: 18px; border: 1px dashed #CDBFA8; border-radius: 16px; padding: 18px; color: var(--muted); }
.empty b { color: var(--ink); }

footer { margin-top: 40px; border-top: 1px solid var(--line); padding-block: 22px 32px; font-size: 14px; color: var(--muted); }
footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: space-between; }
footer a { color: var(--ink); font-weight: 600; }
.unf { margin-top: 28px; font-size: 14px; color: var(--muted); }
.unf summary { cursor: pointer; font-weight: 700; color: var(--ink); min-height: 32px; display: flex; align-items: center; }

/* lives (free tries) */
.lives { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 18px; padding: 12px 14px; background: var(--ink); color: #FAF6EE; border-radius: 14px; box-shadow: 4px 4px 0 var(--accent); max-width: 420px; }
.lives .lv-lbl { font: 800 12px/1 var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: #FFB08F; flex-basis: 100%; }
.lives .hearts { display: flex; gap: 6px; }
.heart { width: 34px; height: 30px; display: block; }
.heart rect { shape-rendering: crispEdges; }
.heart.full rect { fill: var(--accent); }
.heart.lost rect { fill: #4A4640; }
.heart.pop { animation: hp 0.7s ease-out; }
@keyframes hp { 0% { transform: scale(1); } 25% { transform: scale(1.5) rotate(-8deg); } 60% { transform: scale(0.8) rotate(6deg); } 100% { transform: scale(1); } }
.lives .lv-count { font: 800 22px/1 var(--f-mono); letter-spacing: 0.02em; }
.lives .lv-count small { font-size: 13px; color: #B9B1A5; font-weight: 700; }
.lives .lv-msg { flex-basis: 100%; font-size: 13px; color: #D9D2C6; margin: 0; }
.lives.over .lv-lbl { color: #FF8F7A; }
.lives.over .lv-msg b { color: #FFFFFF; }
.lives .lv-own { font: 800 18px/1.2 var(--f-mono); }
.lives .btn { min-height: 38px; font-size: 14px; border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .heart.pop { animation: none; } }

/* tabs (desktop only) */
.tabs { display: none; gap: 8px; }
.rail .notice { margin: 12px 0 0; }
.tab { border: 2px solid var(--ink); background: var(--paper); border-radius: 999px; min-height: 38px; padding: 0 16px; font-weight: 800; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.tab .bar { width: 16px; height: 5px; border-radius: 3px; background: var(--accent); }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* one-screen app layout on laptop */
@media (min-width: 960px) and (min-height: 600px) {
  .chbar .wrap { padding-block: 4px; }
  header.top .wrap { padding-block: 8px; }
  main.app { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 44px; height: calc(100dvh - 92px); min-height: 540px; padding-bottom: 14px; }
  .rail { display: flex; flex-direction: column; min-height: 0; justify-content: center; padding-bottom: 20px; }
  .hero { padding-block: 0; }
  h1 { font-size: clamp(44px, 4.6vw, 68px); max-width: 8ch; }
  .lead { font-size: 17px; margin-top: 14px; }
  .unf { margin-top: 22px; }
  .stage { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; padding: 4px 8px 10px 4px; margin: -4px -8px 0 -4px; }
  .settings { margin-top: 0; }
  .composer { margin-top: 0; padding: 14px; box-shadow: 5px 5px 0 var(--ink); flex: none; }
  .composer label.big { font-size: 17px; margin-bottom: 6px; }
  #raw { min-height: 80px; height: 80px; font-size: 18px; padding: 10px 12px; resize: none; }
  .examples { margin-top: 8px; }
  .chip { min-height: 30px; padding: 3px 10px; font-size: 13px; }
  .params { margin-top: 10px; gap: 8px; }
  .params input, .params select { min-height: 38px; padding: 4px 10px; }
  .ctx { margin-top: 4px; } .ctx summary { min-height: 28px; font-size: 13px; }
  .go { margin-top: 8px; }
  .btn { min-height: 46px; }
  .rail .notice { font-size: 12px; margin-top: 12px; max-width: 420px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .tools .revise { margin: 0; padding: 0; border: 0; background: none; border-radius: 0; margin-left: auto; gap: 6px; }
  .tools .revise p { display: none; }
  .card h3, .card .goal { display: none; }
  .examples .chip:nth-of-type(n+4) { display: none; }
  .examples { flex-wrap: nowrap; overflow: hidden; }
  .examples .chip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  .status { margin-top: 0; }
  .transform, .transform.show { display: none; }
  .assume { margin: 0; }
  .tabs { display: flex; }
  .results { grid-template-columns: minmax(0, 1fr); margin-top: 0; }
  .card:not(.sel) { display: none; }
  .card.sel { padding: 16px; border-width: 2px; }
  .card .text { font-size: 19px; padding: 14px; }
  .card .selbtn { display: none; }
  .revise { margin-top: 0; padding: 8px 12px; }
  .revise p { flex-basis: auto; margin-right: 6px; }
  .empty { margin-top: 0; padding: 14px 16px; }
}
@media (max-width: 959px) { .lives { max-width: none; } h1 { max-width: 12ch; } .stage { display: flex; flex-direction: column; } .tools { display: contents; } .results { order: 1; } .revise { order: 2; } }
@media (min-width: 960px) and (min-height: 600px) { .tools:not(:has(.tab)) { display: none; } }
</style>

<div class="chbar"><div class="wrap"><span><a href="https://the-unfinished-30.vercel.app/" target="_blank" rel="noopener">The Unfinished 30</a> · <span data-i18n="chDay"></span><span class="chtag" data-i18n="chTag"></span></span><span><span data-i18n="chBy"></span> <a href="https://www.linkedin.com/in/salahkhenissi/" target="_blank" rel="noopener">Salah Khenissi</a></span></div></div>

<header class="top"><div class="wrap">
  <a class="brand" href="#main"><span class="mark" aria-hidden="true"></span>Office Filter</a>
  <span class="sp"></span>
  <button type="button" class="iconbtn" id="ai-toggle" aria-expanded="false" aria-controls="settings"><span class="dot" id="ai-dot" aria-hidden="true"></span><span data-i18n="aiBtn"></span></button>
  <div class="seg" role="group" aria-label="Interface language"><button type="button" id="ui-en" aria-pressed="true">EN</button><button type="button" id="ui-fr" aria-pressed="false">FR</button></div>
</div></header>

<main id="main" class="wrap app">
 <aside class="rail">
  <section class="hero">
    <h1><span class="strike" data-i18n="h1a"></span> <span data-i18n="h1b"></span></h1>
    <p class="lead" data-i18n="lead"></p>
  </section>
  <div class="lives" id="lives" hidden></div>
  <p class="notice" id="notice"></p>
  <details class="unf"><summary data-i18n="unfSum"></summary><p data-i18n="unfText"></p></details>
 </aside>
 <div class="stage">

  <section id="settings" class="settings" hidden aria-labelledby="set-title">

      <div class="field"><label class="label" for="apikey" data-i18n="lblKey"></label><input id="apikey" type="password" spellcheck="false" autocomplete="off" data-i18n-ph="phKey"></div>
    </div>
    <p class="hint" id="key-help"></p>
    <p class="hint" data-i18n="keyPrivacy"></p>
    <div><button type="button" class="btn sm" id="set-done" data-i18n="setDone"></button></div>
  </section>

  <section class="composer" aria-labelledby="raw-lbl">
    <label class="big" id="raw-lbl" for="raw" data-i18n="rawLbl"></label>
    <textarea id="raw" maxlength="1500" data-i18n-ph="rawPh"></textarea>
    <div class="examples" id="examples"><span class="lbl" data-i18n="exLbl"></span></div>
    <div class="params">
      <div class="field"><label class="label" for="p-to" data-i18n="lblTo"></label><select id="p-to"></select></div>
      <div class="field"><label class="label" for="p-ch" data-i18n="lblCh"></label><select id="p-ch"></select></div>
      <div class="field"><label class="label" for="p-goal" data-i18n="lblGoal"></label><select id="p-goal"></select></div>

 </div>
</main>

<script>
(function () {
  "use strict";

  /* ================= TEXT ================= */

      var h = document.createElement("h3"); h.innerHTML = '<span class="bar"></span>'; h.appendChild(document.createTextNode(t().tones[tone]));
      var p = document.createElement("p"); p.className = "text"; p.textContent = "…";
      c.append(h, p); r.appendChild(c);
    });
    $("empty").hidden = true; $("tabs").replaceChildren();
  }

  function renderResults(animate) {
    var tx = t(), res = ui.result, r = $("results");
    r.replaceChildren(); r.setAttribute("aria-busy", "false");
    $("empty").hidden = true;
    $("demo-flag").hidden = !ui.demo;
    var as = $("assume");
    if (res.assumption) { as.hidden = false; as.innerHTML = "<b>" + esc(tx.assume) + "</b>"; as.appendChild(document.createTextNode(res.assumption)); } else as.hidden = true;
    res.options.forEach(function (o, i) {
      var c = document.createElement("article"); c.className = "card" + (i === ui.sel ? " sel" : ""); c.dataset.tone = o.tone;
      var h = document.createElement("h3"); h.innerHTML = '<span class="bar" aria-hidden="true"></span>'; h.appendChild(document.createTextNode(tx.tones[o.tone]));
      var g = document.createElement("p"); g.className = "goal"; g.textContent = tx.toneGoal[o.tone];
      var p = document.createElement("p"); p.className = "text"; p.textContent = o.text;
      var w = document.createElement("p"); w.className = "when"; var wb = document.createElement("b"); wb.textContent = tx.useWhen; w.append(wb, document.createTextNode(o.when || ""));
      var row = document.createElement("div"); row.className = "row";
      var cp = document.createElement("button"); cp.type = "button"; cp.className = "btn sm"; cp.textContent = tx.copy;
      var ok = document.createElement("span"); ok.className = "copied"; ok.setAttribute("role", "status");
      cp.addEventListener("click", function () { copyText(o.text, ok, c); });
      var sb = document.createElement("button"); sb.type = "button"; sb.className = "btn sm ghost selbtn";
      sb.textContent = i === ui.sel ? tx.selected : tx.select; sb.setAttribute("aria-pressed", i === ui.sel ? "true" : "false");
      sb.addEventListener("click", function () { ui.sel = i; renderResults(false); });
      row.append(cp, sb, ok);
      c.append(h, g, p, w, row);
      r.appendChild(c);
      if (animate) setTimeout(function () { c.classList.add("in"); }, 250 + i * 160); else c.classList.add("in");
    });
    var tb = $("tabs"); tb.replaceChildren();
    res.options.forEach(function (o, i) {
      var b = document.createElement("button"); b.type = "button"; b.className = "tab"; b.setAttribute("aria-pressed", i === ui.sel ? "true" : "false");
      b.innerHTML = '<span class="bar" aria-hidden="true" style="opacity:' + (o.tone === "diplomatic" ? 0.35 : o.tone === "direct" ? 0.65 : 1) + '"></span>'; b.appendChild(document.createTextNode(tx.tones[o.tone]));
      b.addEventListener("click", function () { ui.sel = i; renderResults(false); });
      tb.appendChild(b);
    });
    $("revise").classList.toggle("show", !ui.demo);
    $("rev-lbl").textContent = fill(tx.revLbl, { t: tx.tones[res.options[ui.sel].tone] });
    var tr = $("transform"); tr.classList.add("show"); $("rawpill").textContent = res.raw;
    if (animate) { tr.classList.remove("done"); setTimeout(function () { tr.classList.add("done"); }, 60); } else tr.classList.add("done");
  }

  function copyText(text, okEl, card) {
    var tx = t();
    function done() { okEl.textContent = tx.copied; setTimeout(function () { okEl.textContent = ""; }, 1800); }
    function manual() {
      var old = card.querySelector(".manual"); if (old) old.remove();
      var ta = document.createElement("textarea"); ta.className = "manual"; ta.readOnly = true; ta.value = text;
      card.appendChild(ta); ta.focus(); ta.select();
      okEl.textContent = tx.copyManual;
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, function () { legacy() || manual(); });
    else if (!legacy()) manual();
    function legacy() {
      try {
        var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select(); var ok = document.execCommand && document.execCommand("copy"); ta.remove();
        if (ok) { done(); return true; }
      } catch (e) {}
      return false;
    }
  }

  /* ================= AI CALL (isolated, swappable) ================= */
  function freeOn() { return !ui.key && ui.free.left > 0; }
  function callFree(system, user, signal) {
    return fetch("/api/rewrite", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ mode: system === SYSTEM ? "main" : "revise", user: user }), signal: signal }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (j && typeof j.left === "number") { ui.free.left = j.left; renderNotice(); }
        if (!r.ok) { var err = new Error("free"); err.status = r.status; err.free = (j && j.error) || "x"; if (r.status === 429 && err.free === "trial_over") ui.free.left = 0; throw err; }
        if (!j || typeof j.text !== "string") { var e2 = new Error("bad"); e2.bad = true; throw e2; }
        return j.text;
      });
    });
  }
  function loadFree() {
    if (!window.fetch) return;
    fetch("/api/rewrite", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (j && typeof j.left === "number") { ui.free = { left: j.left, total: j.total || j.left }; renderNotice(); }
    }).catch(function () {});
  }
  function callAI(system, user, signal) {
    if (freeOn()) return callFree(system, user, signal);
    var p = PROV[ui.prov], url = $("endpoint").value.trim(), model = $("model").value.trim(), key = ui.key;
    var headers = { "content-type": "application/json" }, body, pick;
    if (p.fmt === "anthropic") {
      Object.assign(headers, { "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" });
      body = { model: model, max_tokens: 1200, system: system, messages: [{ role: "user", content: user }] };
      pick = function (j) { return (j.content || []).map(function (c) { return c.text || ""; }).join(""); };
    } else if (p.fmt === "gemini") {
      url = url.replace("{model}", encodeURIComponent(model));
      headers["x-goog-api-key"] = key;
      body = { systemInstruction: { parts: [{ text: system }] }, contents: [{ role: "user", parts: [{ text: user }] }], generationConfig: { responseMimeType: "application/json" } };
      pick = function (j) { return (((j.candidates || [])[0] || {}).content || { parts: [] }).parts.map(function (x) { return x.text || ""; }).join(""); };
    } else {
      headers.authorization = "Bearer " + key;
      body = { model: model, messages: [{ role: "system", content: system }, { role: "user", content: user }] };
      if (ui.prov === "openai") body.response_format = { type: "json_object" };
      pick = function (j) { return (((j.choices || [])[0] || {}).message || {}).content || ""; };
    }
    return fetch(url, { method: "POST", headers: headers, body: JSON.stringify(body), signal: signal }).then(function (r) {
      return r.text().then(function (txt) {
        var j = null; try { j = JSON.parse(txt); } catch (e) {}
        if (!r.ok) { var err = new Error("http"); err.status = r.status; err.detail = (j && j.error && (j.error.message || j.error.type)) || txt.slice(0, 160); throw err; }
        if (!j) { var e2 = new Error("bad"); e2.bad = true; throw e2; }
        return pick(j);
      });
    });
  }

  function parseJSON(text) {
    if (typeof text !== "string") return null;
    var s = text.trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "");
    try { return JSON.parse(s); } catch (e) {}
    var a = s.indexOf("{"), b = s.lastIndexOf("}");
    if (a >= 0 && b > a) { try { return JSON.parse(s.slice(a, b + 1)); } catch (e) {} }
    return null;
  }
  function clean(x, max) { return typeof x === "string" ? x.trim().slice(0, max) : ""; }
  function validateMain(j) {
    if (!j || !Array.isArray(j.options)) return null;
    var out = [];
    ["diplomatic", "direct", "firm"].forEach(function (tone, i) {
      var o = j.options.filter(function (x) { return x && x.tone === tone; })[0] || j.options[i];
      if (o && clean(o.text, 3000)) out.push({ tone: tone, text: clean(o.text, 3000), when: clean(o.when, 300) });
    });
    if (out.length !== 3) return null;
    return { assumption: clean(j.assumption, 400), options: out };
  }
  function validateRev(j) { return j && clean(j.text, 3000) ? { text: clean(j.text, 3000), when: clean(j.when, 300) } : null; }

  function userPayload(req) {
    var names = { to: { auto: "not specified", colleague: "a colleague", manager: "my manager", report: "someone who reports to me", client: "a client" },
      ch: { auto: "not specified", email: "email", chat: "Teams/Slack chat message", oral: "spoken, face to face or on a call" },
      goal: { auto: "not specified", refuse: "say no / refuse", ask: "ask for something", followup: "follow up", clarify: "clarify", boundary: "set a boundary", disagree: "express disagreement" } };
    return [
      "Recipient: " + names.to[req.to],
      "Channel: " + names.ch[req.ch],
      "Goal: " + names.goal[req.goal],
      "Output language: " + (req.lang === "fr" ? "French" : "English"),
      "<raw_thought>\n" + req.raw + "\n</raw_thought>",
      "<context>\n" + (req.ctx || "none") + "\n</context>"
    ].join("\n");
  }

  function errorText(e) {
    var tx = t();
    if (e && e.name === "AbortError") return tx.errCancel;
    if (e && e.bad) return tx.errBad;
    if (e && e.free) {
      if (e.free === "trial_over") return tx.errTrialOver;
      if (e.free === "busy") return tx.errBusy;
      return tx.errNet;
    }
    if (e && e.status) {
      if (e.status === 401 || e.status === 403) return tx.errAuth;
      if (e.status === 429) return tx.errQuota;
      if (e.status >= 500) return fill(tx.errServer, { s: e.status });
      return fill(tx.errModel, { s: e.status, d: e.detail || "" });
    }
    return tx.errNet;
  }

  function setBusy(on, label) {
    ui.busy = on;
    $("go").disabled = on; $("demo").disabled = on;
    $("go").textContent = on ? label : t().goBtn;
    $("cancel").hidden = !on;
    document.querySelectorAll("[data-rev]").forEach(function (b) { b.disabled = on; });
  }

  function run() {
    var tx = t();
    if (ui.busy) return;
    if (!window.fetch || !window.AbortController) { status("err", tx.errOld); return; }
    var raw = $("raw").value.trim();
    if (!raw) { status("err", tx.errEmpty); $("raw").focus(); return; }
    if (!freeOn() && (!ui.key || !$("endpoint").value.trim() || !$("model").value.trim())) { status("err", !ui.key && ui.free.total ? tx.errTrialOver : tx.errNoKey, [[tx.openAi, openSettings]]); return; }
    clearStatus();
    var req = { raw: raw, to: $("p-to").value, ch: $("p-ch").value, goal: $("p-goal").value, lang: $("p-lang").value, ctx: $("ctx").value.trim() };
    ui.lastReq = req; ui.demo = false;
    ui.ctrl = new AbortController();
    setBusy(true, tx.working); skeleton();
    callAI(SYSTEM, userPayload(req), ui.ctrl.signal).then(function (text) {
      var v = validateMain(parseJSON(text));
      if (!v) { var e = new Error("bad"); e.bad = true; throw e; }
      v.raw = raw; ui.result = v; ui.sel = 1;
      renderResults(true);
    }).catch(function (e) {
      $("results").replaceChildren(); $("results").setAttribute("aria-busy", "false");
      if (!ui.result) $("empty").hidden = false; else renderResults(false);
      status("err", errorText(e), e && e.name === "AbortError" ? [] : [[tx.retry, run]].concat(e && (e.status === 401 || e.status === 403 || e.free === "trial_over") ? [[tx.openAi, openSettings]] : []));
    }).then(function () { setBusy(false); ui.ctrl = null; });
  }

  function revise(kind) {
    var tx = t();
    if (ui.busy || !ui.result || ui.demo || !ui.lastReq) return;
    if (!freeOn() && !ui.key) { status("err", ui.free.total ? tx.errTrialOver : tx.errNoKey, [[tx.openAi, openSettings]]); return; }
    clearStatus();
    var cur = ui.result.options[ui.sel], req = ui.lastReq;
    var user = userPayload(req) + "\n<selected_version tone=\"" + cur.tone + "\">\n" + cur.text + "\n</selected_version>\nRequested change: " + kind;
    ui.ctrl = new AbortController();
    setBusy(true, tx.revising);
    var card = $("results").children[ui.sel]; if (card) card.classList.add("skel");
    callAI(REVISE, user, ui.ctrl.signal).then(function (text) {
      var v = validateRev(parseJSON(text));
      if (!v) { var e = new Error("bad"); e.bad = true; throw e; }
      ui.result.options[ui.sel] = { tone: cur.tone, text: v.text, when: v.when || cur.when };
      renderResults(false);
      var c = $("results").children[ui.sel]; if (c) { c.classList.remove("in"); setTimeout(function () { c.classList.add("in"); }, 30); }
    }).catch(function (e) {
      renderResults(false);
      status("err", errorText(e), e && e.name === "AbortError" ? [] : [[tx.retry, function () { revise(kind); }]]);
    }).then(function () { setBusy(false); ui.ctrl = null; });
  }

  function showDemo() {
    if (ui.busy) return;
    var d = t().demo;
    clearStatus();
    ui.demo = true; ui.sel = 1;
    ui.result = { raw: d.raw, assumption: d.assume, options: d.options.map(function (o) { return { tone: o.tone, text: o.text, when: o.when }; }) };
    if (!$("raw").value.trim()) $("raw").value = d.raw;
    renderResults(true);
  }

  function openSettings() {
    var s = $("settings"); s.hidden = false; $("ai-toggle").setAttribute("aria-expanded", "true");
    s.scrollIntoView({ behavior: "smooth", block: "start" }); setTimeout(function () { $("apikey").focus(); }, 250);
  }

  /* ================= EVENTS ================= */
  $("ai-toggle").addEventListener("click", function () {
    var s = $("settings"), open = s.hidden; s.hidden = !open; this.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) $("apikey").focus();
  });
  $("set-done").addEventListener("click", function () { $("settings").hidden = true; $("ai-toggle").setAttribute("aria-expanded", "false"); $("ai-toggle").focus(); });
  $("apikey").addEventListener("input", function () { ui.key = this.value.trim(); renderSettings(); renderNotice(); });
  $("endpoint").addEventListener("input", function () { saveCfg(); renderNotice(); });
  $("model").addEventListener("input", saveCfg);
  $("ui-en").addEventListener("click", function () { ui.lang = "en"; applyLang(); });
  $("ui-fr").addEventListener("click", function () { ui.lang = "fr"; applyLang(); });
  $("go").addEventListener("click", run);
  $("raw").addEventListener("keydown", function (e) { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); } });
  if (window.matchMedia && matchMedia("(min-width: 960px) and (hover: hover)").matches) $("raw").focus();
  $("raw").addEventListener("keydown", function (e) { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); run(); } });
  $("cancel").addEventListener("click", function () { if (ui.ctrl) ui.ctrl.abort(); });
  $("demo").addEventListener("click", showDemo);
  document.querySelectorAll("[data-rev]").forEach(function (b) { b.addEventListener("click", function () { revise(b.getAttribute("data-rev")); }); });

  // Expose for tests and for anyone who wants to swap the AI layer.
  window.OfficeFilter = { callAI: callAI, parseJSON: parseJSON, validateMain: validateMain, validateRev: validateRev, SYSTEM: SYSTEM, REVISE: REVISE };

  loadCfg();
  loadFree();
  applyLang();
  $("p-lang").value = "en";
})();
</script>
</body>
